<title>Shidduch Flow Prototype</title>
<meta name="description" content="Clickable zugbase prototype with made-up data: one ledger underneath, simple shidduch pages on top.">
<style>
/* Layout: one phone-width column. A thin story guide is pinned on top; tabs (or the note bar on
   detail pages) are pinned at the bottom; every form opens as a bottom sheet. */
:root{
  --bg:#f3f2ee; --card:#ffffff; --ink:#1b3349; --muted:#687784; --line:#e0ddd6;
  --accent:#2f5a78; --on-accent:#ffffff; --soft:#e6eff5; --soft-ink:#21445c;
  --wait:#fff1c9; --wait-ink:#6b4c10; --wait-line:#e8cf86;
  --owe:#e3eef7; --owe-ink:#1d4566; --owe-line:#c4d8e9;
  --good:#e3f2e7; --good-ink:#1f5636; --bad:#f7e6e4; --bad-ink:#86302b;
  --story:#1c3549; --story-ink:#eef3f7; --story-dim:#a6bacb;
  --me:#edf3f8; --scrim:#0b151d99; --code:#5d6c78;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Hebrew",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11191f; --card:#19232c; --ink:#e2eaf0; --muted:#94a4b1; --line:#2a3743;
    --accent:#86b5d8; --on-accent:#0e1820; --soft:#1f3140; --soft-ink:#cfe2ef;
    --wait:#3a2f15; --wait-ink:#f0d388; --wait-line:#5c4c20;
    --owe:#1b2e3d; --owe-ink:#bcd7ec; --owe-line:#2d4659;
    --good:#173020; --good-ink:#9fd7ae; --bad:#3a1e1c; --bad-ink:#f0aaa3;
    --story:#0a141d; --story-ink:#e2eaf0; --story-dim:#8aa1b3;
    --me:#1d2a35; --scrim:#000000aa; --code:#a3b3bf; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11191f; --card:#19232c; --ink:#e2eaf0; --muted:#94a4b1; --line:#2a3743;
  --accent:#86b5d8; --on-accent:#0e1820; --soft:#1f3140; --soft-ink:#cfe2ef;
  --wait:#3a2f15; --wait-ink:#f0d388; --wait-line:#5c4c20;
  --owe:#1b2e3d; --owe-ink:#bcd7ec; --owe-line:#2d4659;
  --good:#173020; --good-ink:#9fd7ae; --bad:#3a1e1c; --bad-ink:#f0aaa3;
  --story:#0a141d; --story-ink:#e2eaf0; --story-dim:#8aa1b3;
  --me:#1d2a35; --scrim:#000000aa; --code:#a3b3bf; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.42 var(--font);-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:6px calc(88px + env(safe-area-inset-bottom,0px))}

/* story guide */
#storybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--story);color:var(--story-ink)}
.sb{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;width:100%;border:0;background:none;color:inherit;text-align:left}
.sb .n{font-size:12px;color:var(--story-dim);white-space:nowrap}
.sb .t{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .c{font-size:12px;color:var(--story-dim);white-space:nowrap;font-variant-numeric:tabular-nums}

/* bottom bars */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{border:0;background:none;padding:11px 4px 12px;font-size:13px;font-weight:700;color:var(--muted)}
#tabs button[aria-current="page"]{color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--wait);color:var(--wait-ink);font-size:11px;line-height:18px;margin-left:3px;font-weight:800}
#notebar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
#notebar .in{max-width:480px;margin:0 auto;display:flex;gap:8px}
#notebar input{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--card);padding:0 16px}
.round{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}

/* headers */
.top{display:flex;align-items:center;gap:10px;padding-block:8px 2px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:var(--ink)}
.title{flex:1;min-width:0;font-size:21px;font-weight:800;line-height:1.15;text-wrap:balance}
.bh{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.sub{font-size:13px;color:var(--muted)}
h2{font-size:13.5px;font-weight:750;color:var(--muted);margin:18px 2px 6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.pill{font-size:12.5px;font-weight:700;background:var(--soft);color:var(--soft-ink);border-radius:8px;padding:2px 8px}
.pill.wait{background:var(--wait);color:var(--wait-ink)}
.pill.good{background:var(--good);color:var(--good-ink)}
.pill.end{background:var(--line);color:var(--muted)}

/* cards and rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:none}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .l1{font-weight:700;font-size:14.5px}
.row .l2{font-size:13px;color:var(--muted)}
.row .end{font-size:12.5px;color:var(--muted);white-space:nowrap}
.row.wait{background:var(--wait)}
.row.wait .l2,.row.wait .end{color:var(--wait-ink)}
.chev{color:var(--muted);font-size:18px;line-height:1}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:1px}
.tag.w{background:var(--wait);color:var(--wait-ink);border:1px solid var(--wait-line)}
.tag.o{background:var(--owe);color:var(--owe-ink);border:1px solid var(--owe-line)}
.tag.d{background:var(--soft);color:var(--soft-ink)}
.empty{padding:12px;color:var(--muted);font-size:13.5px}
.link{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;margin-top:8px;text-align:left;font-size:14px}
.link .main{flex:1;min-width:0}
.intro{padding:12px 14px;margin-top:8px}
.intro p{margin:0 0 8px;font-size:14px}

/* buttons, chips, yes/no */
.btn{border:0;border-radius:10px;background:var(--soft);color:var(--soft-ink);padding:7px 12px;font-size:13.5px;font-weight:700;line-height:1.2}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.ghost{background:none;color:var(--accent);padding:6px 2px}
.btn.quiet{background:none;color:var(--muted);padding:6px 2px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.contact{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.contact.four{grid-template-columns:repeat(4,1fr)}
.contact .btn{padding:9px 2px;font-size:12px;text-align:center}
.contact .btn.on{background:var(--wait);color:var(--wait-ink);box-shadow:inset 0 0 0 1px var(--wait-line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.yn{display:inline-flex;gap:4px;flex:none}
.yn button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:750;color:var(--muted)}
.yn button.y[aria-pressed="true"]{background:var(--good);color:var(--good-ink);border-color:var(--good)}
.yn button.n[aria-pressed="true"]{background:var(--soft);color:var(--soft-ink);border-color:var(--soft)}

/* shidduch overview */
.seg{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;margin-block:10px 10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 2px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-current="true"]{background:var(--soft);color:var(--soft-ink)}
.kvr{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:9px 12px;border-top:1px solid var(--line);align-items:start}
.kvr:first-child{border-top:0}
.kvr .k{color:var(--muted);font-size:13px;padding-top:1px}
.kvr .v{font-size:14.5px;min-width:0}
.kvr .v small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.kvr.wait{background:var(--wait)}
.kvr.wait .k,.kvr.wait small{color:var(--wait-ink)}
.kvr .v .btn{margin-top:6px}
.dl{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:2px 0;text-align:left;font-size:14px}
.dl+.dl{margin-top:4px}
.gb{padding:10px 12px;margin-top:10px}

/* history entries */
.ent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 11px;margin-top:6px;display:block;width:100%;text-align:left}
.ent.out{margin-left:26px;width:calc(100% - 26px);background:var(--me)}
.ent.sys{background:none;border-style:dashed}
.ent .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.ent .who{font-size:13px;font-weight:750;margin-top:1px}
.ent .words{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.ent .words.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ent .res{margin-top:4px;font-size:12.5px;color:var(--accent);font-weight:650;line-height:1.4}
.ent .res .q{color:var(--muted);font-weight:500}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.file{font-size:11.5px;font-weight:750;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 2px 2px;padding-top:10px;border-top:2px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.rh b{font-size:14px}
.rh span{font-size:12.5px;color:var(--muted)}

/* sheets */
#sheetwrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim);border:0;width:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;overscroll-behavior:contain}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sh-h h3{flex:1;margin:0;font-size:17px;font-weight:800;line-height:1.25}
.lbl{font-size:13px;color:var(--muted);margin:12px 2px 5px}
input[type=text],input[type=date],input[type=time],textarea{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 12px;width:100%;min-width:0}
textarea{min-height:78px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.orig{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:200px;overflow:auto}
.orig .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
.orig .words{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.props{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prop{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border-top:1px solid var(--line)}
.prop:first-child{border-top:0}
.prop .main{flex:1;min-width:0;font-size:14px}
.prop .main small{display:block;font-size:12.5px;color:var(--muted)}
.prop .inline{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.prop .inline input{width:auto;flex:1 1 120px;padding:6px 9px}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.warnc{background:var(--wait);color:var(--wait-ink);border:1px solid var(--wait-line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{flex:1;padding:11px 12px;font-size:15px}
.steps{margin:10px 0 0;padding:0;list-style:none}
.steps li{display:flex;gap:8px;padding:5px 2px;font-size:13.5px;color:var(--muted)}
.steps li b{width:22px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.steps li.done{color:var(--good-ink)}
.steps li.cur{color:var(--ink);font-weight:750}
.now{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.now .t{font-size:16px;font-weight:800;margin:2px 0 4px}
.now p{margin:0;font-size:14px}

/* toast and the ledger view */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--story);color:var(--story-ink);border-radius:12px;padding:9px 12px;display:flex;gap:12px;align-items:center;font-size:13.5px;width:max-content;max-width:calc(100% - 32px)}
#toast button{background:none;border:0;color:var(--story-ink);font-weight:800;text-decoration:underline;padding:0}
.lg{font:12px/1.45 var(--mono);color:var(--code);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;overflow-x:auto}
.lg div{white-space:pre-wrap;overflow-wrap:anywhere;padding:3px 0;border-top:1px dashed var(--line)}
.lg div:first-child{border-top:0}
.lg b{color:var(--ink)}
.photo{aspect-ratio:3/4;max-width:100%;width:220px;margin:8px auto 0;border-radius:14px;background:linear-gradient(160deg,var(--soft),var(--owe));display:grid;place-items:center;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>

<div id="storybar"></div>
<div id="wrap"><main id="screen"></main></div>
<nav id="tabs" aria-label="Main"></nav>
<form id="notebar" hidden></form>
<div id="sheetwrap" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
/* =====================================================================
   zugbase prototype. Made-up people only. Nothing is sent, nothing leaves
   this page. Underneath: ONE ledger (entries). Rounds, dates and open items
   get permanent IDs; their state is worked out from the entries that name
   those IDs. Person facts are edited directly.
   ===================================================================== */
const KEY='zugbase-shidduch-flow-1';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const T=(y,m,d,h=12,mi=0)=>new Date(y,m-1,d,h,mi).getTime();
const pad=n=>String(n).padStart(2,'0');
const yr=d=>d.getFullYear()!==new Date(S.clock).getFullYear()?', '+d.getFullYear():'';
const fDay=t=>{const d=new Date(t);return DOW[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate()+yr(d);};
const fTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const fWhen=t=>fDay(t)+', '+fTime(t);
const fShort=t=>{const d=new Date(t);return MON[d.getMonth()]+' '+d.getDate()+yr(d);};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
const since=t=>{const n=Math.round((sod(S.clock)-sod(t))/864e5);return n<=0?'today':n===1?'yesterday':n+' days';};
const waited=t=>{const n=Math.round((sod(S.clock)-sod(t))/864e5);return n<=0?'since today':n===1?'since yesterday':'for '+n+' days';};
const dInput=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fromInputs=(ds,ts)=>{const [y,m,d]=String(ds).split('-').map(Number);const [h,mi]=String(ts||'12:00').split(':').map(Number);return T(y,m,d,h||0,mi||0);};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*([^*\n]+)\*/g,'<b>$1</b>');
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const $=s=>document.querySelector(s);

let S=null, NAV=[{s:'home'}], SHEET=null, CACHE={}, TOAST=null;
const dirty=()=>{CACHE={};};
const nid=p=>{S.seq++;return p+S.seq;};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&o.v===1)return o;}}catch(e){}return null;}

/* ---------------- the ledger ---------------- */
function E(id){return S.entries.find(e=>e.id===id);}
function record(e){
  e.id=e.id||nid('e'); if(e.at==null)e.at=S.clock; e.prec=e.prec||'exact'; e.rec=S.clock; S.ord=(S.ord||0)+1; e.ord=S.ord;
  e.to=e.to||[]; e.about=e.about||{}; e.about.p=e.about.p||[]; e.about.s=e.about.s||[]; e.c=e.c||[]; e.files=e.files||[]; e.rounds=e.rounds||{};
  if(e.filed===undefined)e.filed=true;
  S.entries.push(e); if(e.filed)bind(e); dirty(); return e;
}
/* the dates an entry concerns, always by permanent ID (never by time order) */
function dateRefs(e){const d=new Set();for(const c of e.c){if(c.did)d.add(c.did);if(c.t==='date.new')d.add(c.date.id);if(c.t==='item.open'&&c.item.did)d.add(c.item.did);if(c.t==='item.close'&&S.items[c.iid]&&S.items[c.iid].did)d.add(S.items[c.iid].did);}e.about.d=[...d];}
/* identity records are created by the entry that first names them */
function bind(e){
  e.about=e.about||{p:[],s:[]};
  for(const c of e.c){
    if(c.t==='person.new')S.people[c.person.id]=Object.assign({roles:[],phones:[],email:'',city:'',gender:'',age:null},c.person,{bornIn:e.id});
    else if(c.t==='link.new')S.links[c.link.id]=Object.assign({},c.link,{bornIn:e.id});
    else if(c.t==='ver.new')S.vers[c.ver.id]=Object.assign({},c.ver,{bornIn:e.id});
    else if(c.t==='shid.new')S.shid[c.shid.id]=Object.assign({},c.shid,{bornIn:e.id});
    else if(c.t==='round.open')S.rounds[c.round.id]=Object.assign({},c.round,{bornIn:e.id});
    else if(c.t==='date.new')S.dates[c.date.id]=Object.assign({},c.date,{bornIn:e.id});
    else if(c.t==='item.open')S.items[c.item.id]=Object.assign({},c.item,{bornIn:e.id});
  }
  dateRefs(e); dirty();
}
const liveE=e=>!!(e&&e.filed&&!e.deleted);
const alive=x=>!!x&&(!x.bornIn||liveE(E(x.bornIn)));
function live(){if(!CACHE.live)CACHE.live=S.entries.filter(liveE).sort((a,b)=>a.at-b.at||a.ord-b.ord);return CACHE.live;}
function changes(){if(!CACHE.ch){const o=[];for(const e of live())for(const c of e.c)o.push({e,c});CACHE.ch=o;}return CACHE.ch;}

/* ---------------- worked-out state ---------------- */
const P=id=>S.people[id];
const nm=id=>id==='me'?'Me':(P(id)?P(id).name:'Someone');
const his=id=>{const g=P(id)&&P(id).gender;return g==='m'?'his':g==='f'?'her':'their';};
const people=()=>Object.values(S.people).filter(alive);
const shids=()=>Object.values(S.shid).filter(alive);
const pairName=sid=>{const s=S.shid[sid];return nm(s.guy)+' ↔ '+nm(s.girl);};
const other=sid=>{const s=S.shid[sid];return s.guy==='me'?s.girl:s.girl==='me'?s.guy:s.girl;};
const mySide=sid=>{const s=S.shid[sid];return s.girl==='me'?'girl':'guy';};
const theirSide=sid=>mySide(sid)==='guy'?'girl':'guy';
const isMine=sid=>{const s=S.shid[sid];return s.guy==='me'||s.girl==='me';};
function goBetween(sid){const s=S.shid[sid];const g=(s.go&&s.go[theirSide(sid)])||[];return g.filter(p=>alive(P(p)));}
function sideName(sid,side){if(isMine(sid))return side===mySide(sid)?'My side':'Her side';return side==='guy'?'His side':'Her side';}
function fbName(sid,side){if(isMine(sid))return side===mySide(sid)?'My feedback':'Her feedback';return side==='guy'?'His feedback':'Her feedback';}
function roundsOf(sid){return Object.values(S.rounds).filter(r=>r.sid===sid&&alive(r)).sort((a,b)=>a.n-b.n);}
function curRound(sid){const r=roundsOf(sid);return r[r.length-1];}
function roundInfo(r){
  const o=Object.assign({},r,{sug:[],ended:null,paused:null,start:E(r.bornIn).at});
  for(const {e,c} of changes()){
    if(c.rid!==r.id)continue;
    if(c.t==='suggest')o.sug.push({by:c.by,at:e.at,also:!!c.also,e});
    else if(c.t==='round.end')o.ended={by:c.by,why:c.why,at:e.at,e};
    else if(c.t==='pause')o.paused={until:c.until,by:c.by,at:e.at,e};
    else if(c.t==='resume')o.paused=null;
  }
  return o;
}
function itemInfo(id){
  const it=S.items[id]; if(!alive(it))return null;
  let closedBy=null; for(const {e,c} of changes())if(c.t==='item.close'&&c.iid===id){closedBy=e;break;}
  return Object.assign({},it,{open:!closedBy,closedBy,openedBy:E(it.bornIn)});
}
function items(f){return Object.keys(S.items).map(itemInfo).filter(x=>x&&(!f||f(x)));}
const openItems=f=>items(x=>x.open&&(!f||f(x)));
function itemLine(it){if(!it)return 'an item';if(it.purpose==='call')return 'Call '+nm(it.pid)+(it.due?' · '+fShort(it.due):'');return (it.kind==='waiting'?'Waiting on ':'You owe ')+nm(it.pid)+' · '+it.what;}
function dateInfo(did){
  const d=S.dates[did]; if(!alive(d))return null;
  const st=Object.assign({},d,{when:null,place:'',by:'',status:'new',moves:[],fb:{},fbHist:[],notes:[],entries:[]});
  for(const {e,c} of changes()){
    if(e.about.d&&e.about.d.includes(did)&&!st.entries.includes(e))st.entries.push(e);
    const mine=(c.did===did)||(c.t==='date.new'&&c.date.id===did); if(!mine)continue;
    if(!st.entries.includes(e))st.entries.push(e);
    if(c.t==='date.set'){st.when=c.when;st.place=c.place||'';st.by=c.by||'';st.status='set';}
    else if(c.t==='date.move'){st.moves.push({from:st.when,to:c.when,by:c.by,e});st.when=c.when;if(c.place)st.place=c.place;st.status='set';}
    else if(c.t==='date.cancel')st.status='cancelled';
    else if(c.t==='date.happened')st.status='happened';
    else if(c.t==='date.fb'){st.fb[c.side]={val:c.val,e,words:c.words};st.fbHist.push({side:c.side,val:c.val,e});}
    else if(c.t==='date.note')st.notes.push(e);

}
function datesOf(sid,rid){return Object.values(S.dates).filter(d=>d.sid===sid&&(!rid||d.rid===rid)&&alive(d)).sort((a,b)=>a.n-b.n).map(d=>dateInfo(d.id));}
const nextDateN=(sid,rid)=>datesOf(sid,rid).reduce((m,d)=>Math.max(m,d.n),0)+1;
function sideInfo(sid,rid,side){
  let best=null;
  for(const {e,c} of changes()){
    if(c.t==='side'&&c.sid===sid&&c.rid===rid&&c.side===side)best={val:c.val,e,words:c.words};
    else if(c.t==='date.fb'&&c.side===side){const d=S.dates[c.did];if(d&&d.sid===sid&&d.rid===rid)best={val:c.val,e,words:c.words,dn:d.n};}
  }
  return best;
}
const VAL={thinking:'Thinking',questions:'Has questions',yes:'Yes',notnow:'Not now',no:'No',continue:'Continue',unsure:'Unsure',stop:'Stop'};
const byText=(sid,b)=>b==='guy'||b==='girl'?(isMine(sid)&&b===mySide(sid)?'by me':'by her side'):b==='me'?'by me':b?'by '+nm(b):'';
function stageInfo(sid){
  const r=curRound(sid); const ri=roundInfo(r);
  if(ri.ended)return {k:'end',t:'Ended '+byText(sid,ri.ended.by)+(ri.ended.why?' · '+ri.ended.why:'')};
  if(ri.paused&&ri.paused.until>S.clock)return {k:'wait',t:'Paused until '+fShort(ri.paused.until)};
  const ds=datesOf(sid,r.id);
  const due=ds.find(d=>d.status==='set'&&d.when<=S.clock);
  const up=ds.find(d=>d.status==='set'&&d.when>S.clock);
  const last=[...ds].reverse().find(d=>d.status==='happened');
  if(due)return {k:'wait',t:'Did Date '+due.n+' happen?'};
  if(up)return {k:'good',t:(last?'Dating · ':'')+'Date '+up.n+' on '+fDay(up.when)};
  if(last)return {k:'good',t:'Dating · after Date '+last.n};
  const me=sideInfo(sid,r.id,mySide(sid)), th=sideInfo(sid,r.id,theirSide(sid));
  if(th&&th.val==='no')return {k:'end',t:'Her side said no'};
  if(th&&th.val==='notnow')return {k:'wait',t:'Her side: not now'};
  const my=me&&me.val==='yes', ty=th&&th.val==='yes';
  if(my&&ty)return {k:'good',t:'Both said yes · set up Date 1'};
  if(my)return {k:'wait',t:isMine(sid)?'Waiting for her side':'Waiting for her side'};
  if(ty)return {k:'wait',t:isMine(sid)?'Waiting for your answer':'Waiting for his side'};
  if((me&&me.val!=='yes')||(th&&th.val!=='yes')||openItems(i=>i.sid===sid&&i.purpose==='opinion').length)return {k:'',t:'Checking'};
  return {k:'',t:'New idea'};
}
function shidActive(sid){const r=curRound(sid);return !roundInfo(r).ended;}
/* the next action, worked out (never typed) */
function nextInfo(sid){
  const r=curRound(sid), ri=roundInfo(r);
  if(ri.ended)return {t:'Nothing open. This round has ended.'};
  const owe=openItems(i=>i.sid===sid&&i.kind==='owe').sort((a,b)=>a.openedBy.at-b.openedBy.at);
  if(owe[0])return {t:cap(oweVerb(owe[0])),act:'item',arg:owe[0].id,btn:oweBtn(owe[0])};
  const ds=datesOf(sid,r.id);
  const due=ds.find(d=>d.status==='set'&&d.when<=S.clock);
  if(due)return {t:'Did Date '+due.n+' happen?',act:'happened',arg:due.id,btn:'Answer'};
  const lastH=[...ds].reverse().find(d=>d.status==='happened');
  if(lastH&&!lastH.fb[mySide(sid)]&&isMine(sid))return {t:'Your feedback on Date '+lastH.n,act:'feedback',arg:lastH.id,btn:'Add'};
  if(ri.paused&&ri.paused.until>S.clock)return {t:'Nothing to do until '+fShort(ri.paused.until)};
  const up=ds.find(d=>d.status==='set'&&d.when>S.clock);
  const me=sideInfo(sid,r.id,mySide(sid)), th=sideInfo(sid,r.id,theirSide(sid));
  const go=x=>x&&(x.val==='yes'||x.val==='continue');
  const wait=openItems(i=>i.sid===sid&&i.kind==='waiting').sort((a,b)=>a.openedBy.at-b.openedBy.at);
  if(go(me)&&go(th)&&!up&&!wait.length)return {t:'Set up Date '+nextDateN(sid,r.id),act:'setDate',arg:sid,btn:'Set up'};
  if(wait[0])return {t:'Nothing to do: wait for '+nm(wait[0].pid)};
  if(up)return {t:'Date '+up.n+': '+fWhen(up.when)};
  if(!me&&isMine(sid))return {t:'Give your answer',act:'answer',arg:sid,btn:'Answer'};
  return {t:'Nothing open'};
}
function oweVerb(it){

    case 'answer':return 'answer '+nm(it.pid)+' about '+nm(it.sid?other(it.sid):'');
    case 'feedback':return 'tell '+nm(it.pid)+' '+it.what;
    case 'thing':return 'send '+nm(it.pid)+' '+it.what;
    case 'call':return 'call '+nm(it.pid);
    case 'checkin':return it.what+' with '+nm(it.pid)+(it.due?' after '+fShort(it.due):'');
    default:return 'reply to '+nm(it.pid)+': '+it.what;

}

function verLabel(vid){const v=S.vers[vid];if(!v)return 'a profile';if(v.label)return v.label;const all=versionsOf(v.pid);return 'Version '+(all.indexOf(v)+1)+(v.from?' · from '+nm(v.from):'');}
function whoHas(pid){const m={};for(const {e,c} of changes())if(c.t==='ver.sent'&&S.vers[c.vid]&&S.vers[c.vid].pid===pid)m[c.to]={vid:c.vid,at:e.at};return m;}

/* ---------------- matching: which open item does an entry close? ---------------- */
/* dir 'in' = a message from `who`; 'out' = my message to `who`; 'call' = a call with `who`.
   Returns the IDs of the specific items the entry answers. Nothing is guessed from time order. */
function closeMatches(M){
  const res=new Set(); const sid=M.sid, who=M.who;
  const oi=openItems(i=>i.pid===who);
  const inn=M.dir==='in'||M.dir==='call', out=M.dir==='out'||M.dir==='call';
  for(const iid of (M.forItems||[]))res.add(iid);
  for(const p of (M.props||[])){
    if(p.on===false)continue;
    if(!sid&&p.t!=='sendVersion'&&p.t!=='opinion')continue;
    const all=()=>openItems(i=>i.sid===sid).forEach(i=>res.add(i.id));
    if((p.t==='side'&&p.val==='no')||(p.t==='date.fb'&&p.val==='stop')||p.t==='pause'||p.t==='end'){all();continue;}
    if(inn&&p.t==='side'&&p.side!==mySide(sid)&&['yes','notnow'].includes(p.val))oi.filter(i=>i.kind==='waiting'&&i.purpose==='answer'&&i.sid===sid).forEach(i=>res.add(i.id));
    if(inn&&p.t==='date.fb'&&p.side!==mySide(sid)&&p.val==='continue')oi.filter(i=>i.kind==='waiting'&&i.purpose==='feedback'&&i.did===p.did).forEach(i=>res.add(i.id));
    if(inn&&p.t==='opinion')oi.filter(i=>i.kind==='waiting'&&i.purpose==='opinion'&&(!sid||i.sid===sid)).forEach(i=>res.add(i.id));
    if(out&&p.t==='side'&&p.side===mySide(sid))oi.filter(i=>i.kind==='owe'&&i.purpose==='answer'&&i.sid===sid).forEach(i=>res.add(i.id));
    if(out&&p.t==='date.fb'&&p.side===mySide(sid))oi.filter(i=>i.kind==='owe'&&i.purpose==='feedback'&&i.did===p.did).forEach(i=>res.add(i.id));
    if(out&&p.t==='sendVersion')oi.filter(i=>i.kind==='owe'&&i.purpose==='thing').forEach(i=>res.add(i.id));
  }
  if(M.dir==='call'&&M.pdir!=='in')oi.filter(i=>i.kind==='owe'&&i.purpose==='call').forEach(i=>res.add(i.id));
  if(inn&&sid)oi.filter(i=>i.kind==='waiting'&&i.purpose==='opinion'&&i.sid===sid).forEach(i=>res.add(i.id));
  return [...res];
}
function closeOthers(M,matched){
  const want=M.dir==='in'?['waiting']:M.dir==='out'?['owe']:['waiting','owe'];
  return openItems(i=>i.pid===M.who&&want.includes(i.kind)&&!matched.includes(i.id)).map(i=>i.id);
}
function closeList(M){const m=closeMatches(M);const o=closeOthers(M,m);return m.filter(i=>M.closes[i]!==false).concat(o.filter(i=>M.closes[i]===true));}

/* ---------------- turning one-tap choices into ledger changes ---------------- */
function propChanges(p,sid,rid,who){
  const end=by=>[{t:'round.end',sid,rid,by,why:''}];
  switch(p.t){
    case 'side':return [{t:'side',sid,rid,side:p.side,val:p.val,words:p.words||''}].concat(p.val==='no'?end(p.side):[]);
    case 'date.set':{const did=nid('d');return [{t:'date.new',date:{id:did,sid,rid,n:nextDateN(sid,rid)}},{t:'date.set',did,when:whenOf(p),place:p.place||'',by:p.by||''}];}
    case 'date.move':return [{t:'date.move',did:p.did,when:whenOf(p),by:p.by||''}];
    case 'date.fb':return [{t:'date.fb',did:p.did,side:p.side,val:p.val,words:p.words||''}].concat(p.val==='stop'?end(p.side):[]);
    case 'ask':return [{t:'item.open',item:{id:nid('o'),kind:'owe',pid:who,purpose:p.purpose||'thing',what:p.what,sid}}];
    case 'passed':return [{t:'passed',what:p.what,toName:p.toName,sid}];
    case 'phone':{const g=other(sid),per=P(g);if(per&&!per.phones.some(x=>x.n===p.number))per.phones.push({label:'Mobile',n:p.number});return [{t:'fact',pid:g,field:'phone',value:p.number}];}
    case 'pause':return [{t:'pause',sid,rid,until:p.until,by:p.by||''},{t:'item.open',item:{id:nid('o'),kind:'owe',pid:who||goBetween(sid)[0],purpose:'checkin',what:'check in about '+nm(other(sid)),sid,due:p.until}}];
    case 'end':return [{t:'round.end',sid,rid,by:p.by||'',why:p.why||''}];
    default:return [];
  }
}
const whenOf=p=>p._d?fromInputs(p._d,p._t||fTime(p.when||S.clock)):(p._t&&p.when?fromInputs(dInput(p.when),p._t):p.when);

/* ---------------- actions (the UI and "Do it for me" both use these) ---------------- */
function arrive(o){return record({filed:false,ch:'share',prec:'received',from:null,text:o.text,files:o.files||[],hint:o.hint||null,tag:o.tag||'',at:S.clock});}
function findDup(name){const n=(name||'').trim().toLowerCase();if(!n)return null;const p=people().find(x=>x.id!=='me'&&x.name.toLowerCase()===n&&x.roles.includes('single'));if(!p)return null;const s=shids().find(x=>x.girl===p.id&&x.guy==='me');return {pid:p.id,sid:s?s.id:null};}
function defaultShidFor(from,loose){const act=shids().filter(s=>shidActive(s.id)&&(goBetween(s.id).includes(from)||roundInfo(curRound(s.id)).sug.some(x=>x.by===from)));act.sort((a,b)=>lastAt(b.id)-lastAt(a.id));if(act[0])return act[0].id;return loose?((shids().filter(s=>shidActive(s.id))[0]||{}).id||null):null;}
const lastAt=sid=>{const e=entriesOfShid(sid);return e.length?e[e.length-1].at:0;};
function resolveProp(p,sid){
  const q=Object.assign({on:true},p);
  if(!sid)return q;
  const r=curRound(sid), ds=datesOf(sid,r.id);
  if(p.t==='date.move'){const d=ds.find(x=>x.status==='set');q.did=d&&d.id;}
  if(p.t==='date.fb'&&p.target==='last'){const d=[...ds].reverse().find(x=>x.status==='happened');q.did=d&&d.id;}
  return q;
}
function defaultFiling(eid){
  const e=E(eid), h=e.hint||{};
  const F={eid,from:h.from||null,what:h.kind==='idea'?'idea':h.kind==='update'?'about':'note',name:(h.person&&h.person.name)||'',age:(h.person&&h.person.age)||'',city:(h.person&&h.person.city)||'',tag:(h.person&&h.person.tag)||'',contacts:(h.contacts||[]).map(k=>Object.assign({on:true},k)),props:[],closes:{},sid:null,same:true,dup:null,newName:''};
  if(F.what==='idea')F.dup=findDup(F.name);
  if(F.what==='about'){F.sid=(h.shidTag==='leah'&&leahSid())||defaultShidFor(F.from,true);F.props=(h.props||[]).map(p=>resolveProp(p,F.sid));}
  return F;
}
function fileModel(F){return {dir:'in',who:F.from,sid:F.sid,props:F.props,closes:F.closes};}
function commitFiling(F){
  const e=E(F.eid); if(!e)return;
  if(F.from==='__new'&&F.newName.trim()){const id=nid('p');S.people[id]={id,name:F.newName.trim(),roles:['shadchan'],phones:[],gender:'f'};F.from=id;}
  if(F.from==='__new')F.from=null;
  e.from=F.from; e.to=['me']; if(e.ch==='share')e.ch=e.hint?'whatsapp':'pasted';
  const c=[];
  if(F.what==='idea'){
    const name=F.name.trim()||'New idea'; let pid,sid,rid;
    const oweAns=()=>F.from?[{t:'item.open',item:{id:nid('o'),kind:'owe',pid:F.from,purpose:'answer',what:'your answer about '+name,sid}}]:[];
    if(F.dup&&F.same){
      pid=F.dup.pid; sid=F.dup.sid;
      if(sid){const r=curRound(sid);if(roundInfo(r).ended){rid=nid('r');c.push({t:'round.open',round:{id:rid,sid,n:r.n+1}},{t:'suggest',sid,rid,by:F.from});c.push(...oweAns());}else{rid=r.id;c.push({t:'suggest',sid,rid,by:F.from,also:true});}}
      else{sid=nid('s');rid=nid('r');c.push({t:'shid.new',shid:{id:sid,guy:'me',girl:pid,go:{guy:[],girl:F.from?[F.from]:[]}}},{t:'round.open',round:{id:rid,sid,n:1}},{t:'suggest',sid,rid,by:F.from});c.push(...oweAns());}
    }else{
      pid=nid('p'); c.push({t:'person.new',person:{id:pid,name,roles:['single'],gender:'f',age:F.age?{value:+F.age,asOf:e.at}:null,city:F.city||'',phones:[],tag:F.tag||''}});
      const go=F.from?[F.from]:[];
      for(const k of F.contacts){if(k.on===false)continue;const cid=nid('p');c.push({t:'person.new',person:{id:cid,name:k.name,roles:[k.rel==='reference'?'reference':'contact'],gender:k.rel==='mother'?'f':'',phones:k.phone?[{label:'Mobile',n:k.phone}]:[]}});c.push({t:'link.new',link:{id:nid('l'),a:cid,b:pid,kind:k.rel}});if(k.rel==='mother'||k.rel==='father')go.push(cid);}
      sid=nid('s');rid=nid('r');
      c.push({t:'shid.new',shid:{id:sid,guy:'me',girl:pid,go:{guy:[],girl:go}}},{t:'round.open',round:{id:rid,sid,n:1}},{t:'suggest',sid,rid,by:F.from});
      c.push(...oweAns());
    }
    const vid=nid('v'); c.unshift({t:'ver.new',ver:{id:vid,pid,lang:'English',label:'',text:e.text,files:e.files,at:e.at,from:F.from}});
    e.ver=vid; e.about={p:[F.from,pid].filter(Boolean),s:[sid]}; e.rounds={[sid]:rid};
  }else if(F.what==='about'&&F.sid){
    const sid=F.sid, rid=curRound(sid).id;
    const cl=closeList(fileModel(F));
    for(const p of F.props)if(p.on!==false)c.push(...propChanges(p,sid,rid,F.from));
    for(const iid of cl)c.push({t:'item.close',iid});
    e.about={p:[F.from,other(sid)].filter(Boolean),s:[sid]}; e.rounds={[sid]:rid};
  }else if(F.what==='single'||F.what==='shadchan'){
    const pid=nid('p'); c.push({t:'person.new',person:{id:pid,name:F.name.trim()||'New person',roles:[F.what],gender:F.what==='single'?'f':'f',phones:[]}});
    e.about={p:[F.from,pid].filter(Boolean),s:[]};
  }else{ e.about={p:[F.from].filter(Boolean),s:[]}; }
  e.c=c; e.filed=true; bind(e);
}
function defaultShare(o){
  const subj=o.subject, mine=subj==='me', vers=versionsOf(subj);
  const ver=o.ver||(mine?(newestMine()||{}).id:(vers[vers.length-1]||{}).id);
  const to=o.to||null;
  const why=o.why||(to&&P(to)&&P(to).roles.includes('friend')?'opinion':'just');
  const M={subject:subj,sid:o.sid||null,to,why,ver,photo:mine,ch:'whatsapp',text:'',textEdited:false,closes:{},forItems:o.forItems||[]};
  M.text=o.text||shareText(M); return M;
}
function shareText(M){if(M.subject==='me')return 'Here is my newest profile.';if(M.why==='opinion')return 'What do you think about this idea for me?';if(M.why==='suggest')return 'An idea: '+nm(M.subject)+'. What do you think?';return nm(M.subject)+"'s profile.";}
function shareModel(M){return {dir:'out',who:M.to,sid:M.sid,props:[{t:'sendVersion'}],forItems:M.forItems,closes:M.closes};}
function commitShare(M){
  if(!M.to)return false;
  const v=S.vers[M.ver]; const files=((v&&v.files)||[]).filter(f=>f.kind!=='photo'||M.photo);
  const sid=M.sid, rid=sid?curRound(sid).id:null;
  const cl=closeList(shareModel(M));
  const c=[{t:'ver.sent',vid:M.ver,to:M.to}];
  if(M.why==='opinion')c.push({t:'item.open',item:{id:nid('o'),kind:'waiting',pid:M.to,purpose:'opinion',what:his(M.to)+' opinion on '+nm(M.subject),sid}});
  if(M.why==='suggest')c.push({t:'item.open',item:{id:nid('o'),kind:'waiting',pid:M.to,purpose:'answer',what:'an answer about '+nm(M.subject),sid}});
  for(const iid of cl)c.push({t:'item.close',iid});
  record({from:'me',to:[M.to],ch:M.ch,text:M.text,ver:M.ver,files,about:{p:[M.to,M.subject].filter(x=>x!=='me'),s:sid?[sid]:[]},rounds:sid?{[sid]:rid}:{},c});

function commitCompose(M){
  const sid=M.sid, rid=sid?curRound(sid).id:null;
  const cl=closeList(composeModel(M));
  const c=[];
  if(sid)for(const p of M.props)if(p.on!==false)c.push(...propChanges(p,sid,rid,M.to));
  for(const iid of cl)c.push({t:'item.close',iid});
  if(sid&&isMine(sid)){
    const yes=M.props.some(p=>p.on!==false&&p.t==='side'&&p.side===mySide(sid)&&p.val==='yes');
    if(yes&&!openItems(i=>i.kind==='waiting'&&i.purpose==='answer'&&i.sid===sid).length)c.push({t:'item.open',item:{id:nid('o'),kind:'waiting',pid:M.to,purpose:'answer',what:nm(other(sid))+"'s answer",sid}});
  }
  record({from:'me',to:[M.to],ch:M.ch,text:M.text,about:{p:[M.to].concat(sid?[other(sid)]:[]),s:sid?[sid]:[]},rounds:sid?{[sid]:rid}:{},c});
}
function defaultCall(pid,o){
  o=o||{};

  const sid=(op&&op.sid)||defaultShidFor(pid)||null;
  return {pid,pdir:o.dir||'out',sid,note:'',suggest:o.suggest||'',props:[],answered:true,closes:{}};
}
function callModel(M){return {dir:'call',pdir:M.pdir,who:M.pid,sid:M.sid,props:M.props,closes:M.closes};}
function commitCall(M){
  const sid=M.sid, rid=sid?curRound(sid).id:null;
  const cl=closeList(callModel(M)); const c=[];
  if(sid)for(const p of M.props)if(p.on!==false)c.push(...propChanges(p,sid,rid,M.pid));

  const inn=M.pdir==='in';

}

function storyTick(){
  let moved=false;
  while(S.story.i<STEPS.length&&STEPS[S.story.i].done()){S.story.done[STEPS[S.story.i].id]=true;S.story.i++;moved=true;const n=STEPS[S.story.i];if(n&&n.at>S.clock)S.clock=n.at;dirty();}
  if(S.story.i===0&&S.clock<STEPS[0].at)S.clock=STEPS[0].at;
  return moved;
}

function changeText(c,e){

    case 'suggest':return 'Suggested by '+nm(c.by)+(c.also?' (also)':'');
    case 'shid.new':return 'New shidduch: '+pairName(c.shid.id);
    case 'round.open':return c.round.n>1?'Round '+c.round.n+' starts on the same record':'';
    case 'person.new':return c.person.roles&&c.person.roles.includes('single')?'New: '+c.person.name:'Added: '+c.person.name;
    case 'link.new':return '';
    case 'ver.new':return '';
    case 'ver.sent':return 'Sent: '+(S.vers[c.vid]&&S.vers[c.vid].pid==='me'?'my profile ':'')+verLabel(c.vid);
    case 'date.set':{const d=S.dates[c.did];return 'Date '+(d?d.n:'')+' set: '+fWhen(c.when)+(c.place?' · '+c.place:'');}
    case 'date.move':{const d=S.dates[c.did];return 'Date '+(d?d.n:'')+' moved to '+fWhen(c.when)+(c.by?' ('+(c.by==='girl'?'her side':c.by==='guy'?'my side':nm(c.by))+' asked)':'');}
    case 'date.happened':{const d=S.dates[c.did];return 'Date '+(d?d.n:'')+' happened';}
    case 'date.cancel':{const d=S.dates[c.did];return 'Date '+(d?d.n:'')+' cancelled';}
    case 'date.fb':{const d=S.dates[c.did];return d?fbName(d.sid,c.side)+' on Date '+d.n+': '+VAL[c.val]:'';}
    case 'date.note':{const d=S.dates[c.did];return d?'Note on Date '+d.n:'';}

    case 'round.end':{const r=S.rounds[c.rid];return 'Round '+(r?r.n:'')+' ended '+byText(c.sid,c.by)+(c.why?' · '+c.why:'');}

function resultHtml(e){

  }
  if(!main.length&&!q.length)return '';

function contactRow(pid,withWaiting){
  const w=openItems(i=>i.pid===pid&&i.kind==='waiting').length;
  return '<div class="contact'+(withWaiting?'':' four')+'"><button class="btn" data-act="call" data-arg="'+pid+'">Call</button><button class="btn" data-act="msg" data-arg="'+pid+'|email">Email</button><button class="btn" data-act="msg" data-arg="'+pid+'|whatsapp">WhatsApp</button><button class="btn" data-act="msg" data-arg="'+pid+'|sms">SMS</button>'+(withWaiting?'<button class="btn'+(w?' on':'')+'" data-act="waiting" data-arg="'+pid+'">Waiting'+(w>1?' '+w:'')+'</button>':'')+'</div>';
}
function personScreen(v){
  const p=P(v.id); if(!alive(p))return '<div class="empty">This person is gone (undone).</div>';
  const single=p.roles.includes('single')&&p.id!=='me';
  let h='<div class="top">'+back+'<div class="title">'+esc(p.name==='Me'?'My profile':p.name)+'</div>'+(single&&p.gender==='f'?'<button class="btn sm" data-act="photo" data-arg="'+p.id+'">Photo</button>':'')+'<div class="bh">ב״ה<br><button class="btn sm" data-act="edit" data-arg="'+p.id+'">Edit</button></div></div>';
  const age=p.age?p.age.value+Math.floor((S.clock-p.age.asOf)/(365.25*864e5)):null;
  h+='<div class="pills">'+(age?'<span class="pill">Age '+age+'</span>':'')+(p.city?'<span class="pill">'+esc(p.city)+'</span>':'')+p.roles.filter(r=>r!=='me').map(r=>'<span class="pill">'+esc(cap(r))+'</span>').join('')+'</div>';
  const ss=shids().filter(s=>s.girl===p.id||s.guy===p.id);
  if(single)for(const s of ss)h+='<button class="card link" data-act="openShid" data-arg="'+s.id+'"><div class="main">'+(isMine(s.id)?'Shidduch with me':'Shidduch with '+esc(nm(s.guy===p.id?s.girl:s.guy)))+': <b>'+esc(stageInfo(s.id).t)+'</b></div><span class="chev">›</span></button>';
  if(p.id!=='me'&&!single){
    const w=openItems(i=>i.pid===p.id&&i.kind==='waiting').length, o=openItems(i=>i.pid===p.id&&i.kind==='owe').length;
    const inS=shids().filter(s=>goBetween(s.id).includes(p.id)||roundsOf(s.id).some(r=>roundInfo(r).sug.some(x=>x.by===p.id)));
    h+='<div class="card link"><div class="main">Waiting on '+(p.gender==='m'?'him':'her')+': <b>'+w+'</b> · You owe '+(p.gender==='m'?'him':'her')+': <b>'+o+'</b>'+(inS.length?' · Shidduchim: <b>'+inS.length+'</b>':'')+'</div></div>';
  }
  if(p.id!=='me'){
    const ph=p.phones[0];
    if(ph)h+='<div class="sub" style="margin-top:8px">'+esc(ph.label)+' · '+esc(ph.n)+'</div>';
    h+=contactRow(p.id,true);
    const cd=openItems(i=>i.pid===p.id&&i.purpose==='call')[0];
    h+='<div class="btns" style="margin-top:8px;align-items:center"><span class="sub">Call due:</span><button class="chip" aria-pressed="'+(!!cd&&sod(cd.due)===sod(S.clock))+'" data-act="callDue" data-arg="'+p.id+'|0">Today</button><button class="chip" aria-pressed="'+(!!cd&&sod(cd.due)===sod(S.clock)+864e5)+'" data-act="callDue" data-arg="'+p.id+'|1">Tomorrow</button>'+(cd?'<button class="chip" data-act="callDue" data-arg="'+p.id+'|x">Clear</button>':'')+'</div>';
  }
  const vs=versionsOf(p.id);
  if(p.id==='me'){
    const has=whoHas('me');
    h+='<h2>My profile versions</h2>'+vs.slice().reverse().map(v=>{const who=Object.keys(has).filter(k=>has[k].vid===v.id);return '<div class="card" style="padding:10px 12px;margin-top:6px"><b>'+esc(v.label)+'</b> <span class="sub">· '+esc(fShort(v.at))+'</span>'+filesHtml(v.files)+'<div class="sub" style="margin-top:4px">'+(who.length?'Has it: '+who.map(k=>esc(nm(k))+' ('+esc(fShort(has[k].at))+')').join(', '):'Nobody has this version now')+'</div></div>';}).join('');
    h+='<div class="btns" style="margin-top:10px"><button class="btn" data-act="shareMe">Send my profile</button></div>';
  }else if(vs.length){
    const v=vs[vs.length-1];
    h+='<h2>Profile · '+esc(verLabel(v.id))+(vs.length>1?' · '+vs.length+' versions':'')+'</h2><div class="card" style="padding:12px 14px"><div class="words" style="white-space:pre-wrap">'+rich(v.text)+'</div>'+filesHtml(v.files)+'</div>';
    if(vs.length>1)h+='<div class="sub" style="margin-top:6px">Other versions: '+vs.slice(0,-1).map(x=>esc(verLabel(x.id))+' ('+esc(fShort(x.at))+')').join(', ')+'</div>';
    if(single)h+='<div class="btns" style="margin-top:10px"><button class="btn" data-act="sharePerson" data-arg="'+p.id+'">Share profile</button></div>';
  }
  const ls=Object.values(S.links).filter(l=>alive(l)&&(l.b===p.id||l.a===p.id));
  if(ls.length)h+='<h2>Contacts</h2><div class="list">'+ls.map(l=>{const o=l.b===p.id?l.a:l.b;return '<button class="row" data-act="openPerson" data-arg="'+o+'"><div class="main"><div class="l1">'+esc(nm(o))+'</div><div class="l2">'+esc(l.b===p.id?(l.kind==='mother'?'Her mother':cap(l.kind)):cap(l.kind)+' of '+nm(l.b))+((P(o).phones[0])?' · '+esc(P(o).phones[0].n):'')+'</div></div><span class="chev">›</span></button>';}).join('')+'</div>';
  const es=entriesOfPerson(p.id).slice().reverse();
  h+='<h2>History</h2>'+(es.length?es.slice(0,12).map(e=>entHtml(e,true)).join(''):'<div class="empty">Nothing yet.</div>');
  if(p.id!=='me')h+='<div class="note">'+(p.bornIn?'Added '+esc(fWhen(E(p.bornIn).at)):'Added before this prototype')+'</div>';
  return h;
}
function dateScreen(v){
  const d=dateInfo(v.id); if(!d)return '<div class="empty">This date is gone (undone).</div>';
  const sid=d.sid, mine=isMine(sid);
  let h='<div class="top">'+back+'<div class="title">Date '+d.n+' · '+esc(nm(other(sid)))+'</div><div class="bh">ב״ה</div></div>';
  h+='<div class="sub">'+esc(pairName(sid))+(roundsOf(sid).length>1?' · Round '+S.rounds[d.rid].n:'')+'</div>';
  const fb=s=>{const f=d.fb[s];if(!f)return '<span class="sub">Not yet</span>';const hist=d.fbHist.filter(x=>x.side===s);return esc(VAL[f.val])+'<small>'+(f.e.from&&f.e.from!=='me'?'via '+esc(nm(f.e.from))+', ':'')+esc(fShort(f.e.at))+(hist.length>1?' · earlier: '+hist.slice(0,-1).map(x=>esc(VAL[x.val])).join(', '):'')+'</small>';};
  h+='<div class="list" style="margin-top:10px">';
  h+='<div class="kvr"><div class="k">When</div><div class="v">'+esc(d.when?fWhen(d.when):'No time yet')+(d.moves.length?'<small>Moved '+d.moves.map(m=>'from '+esc(fWhen(m.from))+(m.by?' ('+(m.by==='girl'?'her side':m.by==='guy'?'my side':esc(nm(m.by)))+' asked)':'')).join('; ')+'</small>':'')+'</div></div>';
  h+='<div class="kvr"><div class="k">Where</div><div class="v">'+esc(d.place||'—')+'</div></div>';
  h+='<div class="kvr"><div class="k">Set up by</div><div class="v">'+esc(d.by==='me'?'Me, directly':d.by?nm(d.by):'—')+'</div></div>';
  h+='<div class="kvr"><div class="k">Status</div><div class="v">'+esc(cap(dStatus(d)))+'</div></div>';
  h+='<div class="kvr"><div class="k">'+(mine?'My feedback':'His feedback')+'</div><div class="v">'+fb(mySide(sid))+'</div></div>';
  h+='<div class="kvr"><div class="k">Her feedback</div><div class="v">'+fb(theirSide(sid))+'</div></div>';
  h+='</div>';
  if(shidActive(sid)){
    h+='<div class="btns" style="margin-top:10px">';
    if(d.status==='set'&&d.when<=S.clock)h+='<button class="btn pri" data-act="happened" data-arg="'+d.id+'">Did it happen?</button>';
    if(d.status==='set')h+='<button class="btn" data-act="move" data-arg="'+d.id+'">Move it</button><button class="btn" data-act="cancelDate" data-arg="'+d.id+'">Cancelled</button>';
    if(d.status==='happened')h+='<button class="btn" data-act="feedback" data-arg="'+d.id+'">My feedback</button>';
    h+='</div>';
  }
  h+='<h2>Everything about Date '+d.n+'</h2>'+d.entries.slice().reverse().map(e=>entHtml(e,false)).join('');
  return h;
}
function ledgerScreen(){
  const L=x=>'<div>'+x+'</div>';
  const its=items().sort((a,b)=>a.openedBy.at-b.openedBy.at);
  let h='<div class="top">'+back+'<div class="title">Behind the scenes</div></div><div class="sub">The ledger underneath, for checking the model. Daily use never needs this screen.</div>';
  h+='<h2>Open items ('+its.filter(i=>i.open).length+' open)</h2><div class="lg">'+its.map(i=>L('<b>'+i.id+'</b> '+(i.open?'OPEN':'closed')+' · '+i.kind+' · '+i.purpose+' · '+esc(nm(i.pid))+' · '+esc(i.what)+(i.sid?' · shidduch '+i.sid:'')+(i.did?' · date '+i.did:'')+'\n   opened by '+i.openedBy.id+(i.closedBy?' · closed by '+i.closedBy.id:''))).join('')+'</div>';
  const ds=Object.keys(S.dates).map(dateInfo).filter(Boolean);
  h+='<h2>Dates ('+ds.length+')</h2><div class="lg">'+(ds.map(d=>L('<b>'+d.id+'</b> Date '+d.n+' · shidduch '+d.sid+' · round '+d.rid+' · '+d.status+(d.when?' · '+esc(fWhen(d.when)):'')+'\n   entries pointing here: '+d.entries.map(e=>e.id).join(', '))).join('')||L('none yet'))+'</div>';
  const rs=Object.values(S.rounds).filter(alive);
  h+='<h2>Rounds</h2><div class="lg">'+rs.map(r=>{const ri=roundInfo(r);return L('<b>'+r.id+'</b> '+esc(pairName(r.sid))+' · round '+r.n+' · opened by '+r.bornIn+(ri.ended?' · ended by '+ri.ended.e.id:''));}).join('')+'</div>';
  const es=S.entries.slice().sort((a,b)=>b.at-a.at||b.ord-a.ord);
  h+='<h2>Ledger ('+es.length+' entries)</h2><div class="lg">'+es.map(e=>L('<b>'+e.id+'</b> '+esc(fWhen(e.at))+' ('+e.prec+')'+(e.deleted?' DELETED':'')+(!e.filed?' UNFILED':'')+' · '+esc(CH[e.ch]||e.ch)+' · '+esc(whoLine(e))+(e.about.s.length?' · about '+e.about.s.map(s=>s+(e.rounds[s]?'/'+e.rounds[s]:'')).join(','):'')+(e.ver?' · version '+e.ver:'')+(e.c.length?'\n   '+e.c.map(code).join('\n   '):''))).join('')+'</div>';
  return h;
}
function code(c){
  switch(c.t){
    case 'item.open':return 'item.open '+c.item.id+' ('+c.item.kind+' '+c.item.purpose+', '+c.item.pid+(c.item.did?', '+c.item.did:'')+')';
    case 'item.close':return 'item.close '+c.iid;
    case 'date.new':return 'date.new '+c.date.id+' (Date '+c.date.n+')';
    case 'date.set':case 'date.move':return c.t+' '+c.did+' → '+fWhen(c.when);
    case 'date.happened':case 'date.note':return c.t+' '+c.did;
    case 'date.cancel':return c.t+' '+c.did;
    case 'date.fb':return 'date.fb '+c.did+' '+c.side+'='+c.val;
    case 'side':return 'side '+c.sid+'/'+c.rid+' '+c.side+'='+c.val+(c.words?' (words: '+c.words+')':'');
    case 'shid.new':return 'shid.new '+c.shid.id;
    case 'round.open':return 'round.open '+c.round.id+' (round '+c.round.n+')';
    case 'round.end':return 'round.end '+c.rid+' by '+c.by+(c.why?' ('+c.why+')':'');
    case 'suggest':return 'suggest '+c.sid+'/'+c.rid+' by '+c.by;
    case 'person.new':return 'person.new '+c.person.id+' '+c.person.name;
    case 'link.new':return 'link.new '+c.link.a+' '+c.link.kind+' of '+c.link.b;
    case 'ver.new':return 'ver.new '+c.ver.id;
    case 'ver.sent':return 'ver.sent '+c.vid+' → '+c.to;
    case 'pause':return 'pause '+c.rid+' until '+fShort(c.until);
    default:return c.t;
  }
}

/* ---------------- sheets ---------------- */
function openSheet(type,model){SHEET={type,model};document.body.classList.add('noscroll');$('#toast').hidden=true;renderSheet();}
function closeSheet(silent){SHEET=null;document.body.classList.remove('noscroll');if(!silent)renderSheet();else{const w=$('#sheetwrap');w.innerHTML='';w.hidden=true;}}
function renderSheet(){
  const w=$('#sheetwrap');
  if(!SHEET){w.innerHTML='';w.hidden=true;return;}
  const old=w.querySelector('.sheet'); const sc=old?old.scrollTop:0;
  w.hidden=false;
  w.innerHTML='<button class="scrim" data-act="sheetClose" aria-label="Close"></button><section class="sheet" role="dialog" aria-modal="true">'+SHEETS[SHEET.type](SHEET.model)+'</section>';
  const s=w.querySelector('.sheet'); if(s&&old)s.scrollTop=sc;
}
const head=(t,cancel)=>'<div class="sh-h"><h3>'+t+'</h3><button class="btn quiet" data-act="sheetClose">'+(cancel||'Cancel')+'</button></div>';
const yn=(path,on)=>'<span class="yn"><button class="y" data-act="set" data-arg="'+path+'=true" aria-pressed="'+(on!==false)+'">Yes</button><button class="n" data-act="set" data-arg="'+path+'=false" aria-pressed="'+(on===false)+'">No</button></span>';
const chips=(path,cur,opts)=>'<div class="chips">'+opts.map(([v,l])=>'<button class="chip" data-act="set" data-arg="'+path+'='+v+'" aria-pressed="'+(String(cur)===String(v))+'">'+esc(l)+'</button>').join('')+'</div>';
const chOpts=[['email','Email'],['whatsapp','WhatsApp'],['sms','SMS']];
function closesHtml(M){
  const m=closeMatches(M), o=closeOthers(M,m);
  let h='';
  if(m.length)h+='<div class="lbl">This closes</div><div class="props">'+m.map(iid=>'<div class="prop"><div class="main">'+esc(itemLine(itemInfo(iid)))+'</div>'+yn('closes.'+iid,M.closes[iid]!==false)+'</div>').join('')+'</div>';
  if(o.length)h+='<div class="lbl">Other open items with '+esc(nm(M.who))+'</div><div class="props">'+o.map(iid=>'<div class="prop"><div class="main">'+esc(itemLine(itemInfo(iid)))+'<small>Stays open unless you say Yes</small></div>'+yn('closes.'+iid,M.closes[iid]===true)+'</div>').join('')+'</div>';
  return h;

function propHtml(p,i,sid,base){
  const path=base+'.'+i;
  let main='', inline='';
  const r=sid?curRound(sid):null;
  switch(p.t){
    case 'side':main=esc(sideName(sid,p.side))+': <b>'+esc(VAL[p.val])+'</b>'+(p.words?'<small>'+esc(p.words)+"'s words, passed on</small>":'');inline=chips(path+'.val',p.val,[['yes','Yes'],['no','No'],['thinking','Thinking'],['notnow','Not now']]);break;
    case 'date.set':main='Sets Date '+nextDateN(sid,r.id)+'<small>'+esc(fWhen(whenOf(p)))+(p.place?' · '+esc(p.place):'')+(p.by?' · set up by '+esc(p.by==='me'?'me':nm(p.by)):'')+'</small>';inline='<input type="date" aria-label="Date" data-bind="'+path+'._d" value="'+dInput(whenOf(p))+'"><input type="time" aria-label="Time" data-bind="'+path+'._t" value="'+fTime(whenOf(p))+'"><input type="text" aria-label="Place" data-bind="'+path+'.place" value="'+esc(p.place||'')+'">';break;
    case 'date.move':{const d=p.did&&dateInfo(p.did);const open=datesOf(sid,r.id).filter(x=>x.status==='set');main=d?'Moves <b>Date '+d.n+'</b> (now '+esc(fWhen(d.when))+')<small>to '+esc(fWhen(whenOf(p)))+(p.by==='girl'?' · her side asked':'')+'</small>':'Moves a date<small>Pick which one</small>';inline=(open.length>1||!d?chips(path+'.did',p.did,open.map(x=>[x.id,'Date '+x.n])):'')+'<input type="date" aria-label="New date" data-bind="'+path+'._d" value="'+dInput(whenOf(p))+'"><input type="time" aria-label="New time" data-bind="'+path+'._t" value="'+fTime(whenOf(p))+'">';break;}
    case 'date.fb':{const d=p.did&&dateInfo(p.did);main=d?esc(fbName(sid,p.side))+' on <b>Date '+d.n+'</b>: <b>'+esc(VAL[p.val])+'</b>'+(['unsure'].includes(p.val)?'<small>The wait for her feedback stays open</small>':''):'Feedback, but no date has happened';inline=chips(path+'.val',p.val,[['continue','Continue'],['unsure','Unsure'],['stop','Stop']]);break;}
    case 'ask':main='Asks you for: <b>'+esc(p.what)+'</b><small>You owe '+esc(nm(SHEET.model.from||SHEET.model.to))+' that</small>';break;
    case 'passed':main='Passed on: '+esc(p.what)+' → '+esc(p.toName);break;
    case 'phone':main='Adds '+esc(nm(other(sid)))+"'s phone: <b>"+esc(p.number)+'</b><small>Saved straight to her details</small>';break;
    case 'pause':main='Pauses this shidduch until <b>'+esc(fShort(p.until))+'</b><small>Open items close; one quiet check-in waits for that date</small>';break;
    case 'end':main='Ends Round '+r.n+' · '+esc(byText(sid,p.by))+(p.why?' · why: <b>'+esc(p.why)+'</b>':'')+'<small>Every open item of this shidduch closes</small>';break;
    case 'opinion':main=esc(nm(SHEET.model.pid||SHEET.model.from))+"'s opinion<small>Answers your question about "+esc(nm(other(sid)))+'</small>';break;
  }
  const canEdit=inline&&p.on!==false;
  return '<div class="prop"><div class="main">'+main+(canEdit&&!p.edit?'<button class="btn ghost sm" style="padding:2px 0" data-act="set" data-arg="'+path+'.edit=true">Change</button>':'')+(canEdit&&p.edit?'<div class="inline">'+inline+'</div>':'')+'</div>'+yn(path+'.on',p.on)+'</div>';
}

/* ---------------- top-level render ---------------- */
function render(){
  dirty();
  if(storyTick())save();
  const st=STEPS[S.story.i];
  $('#storybar').innerHTML='<button class="sb" data-act="story" data-t="storybar"><span class="n">'+(st?(st.extra?'Extra '+(S.story.i-MAIN+1)+'/'+(STEPS.length-MAIN):'Step '+(S.story.i+1)+'/'+MAIN):'Done')+'</span><span class="t">'+esc(st?st.title:'The story is complete')+'</span><span class="c">'+esc(fWhen(S.clock))+' ›</span></button>';
  const v=top();
  const scr={home:homeScreen,shidduchim:shidListScreen,people:peopleScreen,intake:intakeScreen,shid:shidScreen,person:personScreen,date:dateScreen,ledger:ledgerScreen}[v.s];
  $('#screen').innerHTML=scr(v);
  const detail=['shid','person','date'].includes(v.s), tabbed=['home','shidduchim','people','intake'].includes(v.s);
  const unf=S.entries.filter(e=>!e.filed&&!e.deleted).length;
  const tabs=$('#tabs');tabs.hidden=!tabbed;
  if(tabbed)tabs.innerHTML='<div class="in">'+[['home','Home'],['shidduchim','Shidduchim'],['people','People'],['intake','Intake']].map(([k,l])=>'<button data-act="goTab" data-arg="'+k+'" aria-current="'+(v.s===k?'page':'false')+'">'+l+(k==='intake'&&unf?'<span class="badge">'+unf+'</span>':'')+'</button>').join('')+'</div>';
  const nb=$('#notebar');nb.hidden=!detail;
  if(detail&&nb.dataset.for!==v.s+v.id){nb.dataset.for=v.s+v.id;nb.innerHTML='<div class="in"><input id="noteInput" type="text" placeholder="Note…" aria-label="Note" autocomplete="off"><button class="round" type="submit" aria-label="Save note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div>';}
  if(SHEET)renderSheet();
}

function setPath(o,path,val){const ks=path.split('.');let x=o;for(let i=0;i<ks.length-1;i++){if(x[ks[i]]==null)x[ks[i]]={};x=x[ks[i]];}x[ks[ks.length-1]]=val;}
const parse=v=>v==='true'?true:v==='false'?false:v;
const ACT={
 goTab:a=>goTab(a), back:()=>{NAV.pop();if(!NAV.length)NAV=[{s:'home'}];render();window.scrollTo(0,0);},
 openShid:a=>openShid(a), shidTab:a=>{top().tab=a;render();}, openPerson:a=>{closeSheet(true);push({s:'person',id:a});}, openDate:a=>{closeSheet(true);push({s:'date',id:a});},
 fold:a=>{S.ui.fold[a]=!S.ui.fold[a];save();render();},
 introHide:()=>{S.ui.intro=false;save();render();},
 story:()=>openSheet('story',{}), ledger:()=>{closeSheet(true);push({s:'ledger'});},
 sheetClose:()=>closeSheet(),
 set:a=>{const i=a.indexOf('=');const path=a.slice(0,i),val=parse(a.slice(i+1));const M=SHEET.model;setPath(M,path,val);
   if(SHEET.type==='file'&&path==='what'&&val==='about'&&!M.sid){M.sid=defaultShidFor(M.from,true);}
   if(SHEET.type==='file'&&path==='what'&&val==='idea')M.dup=findDup(M.name);
   if(SHEET.type==='share'&&(path==='why'||path==='to')&&!M.textEdited){if(path==='to'&&P(val)&&P(val).roles.includes('friend')&&M.subject!=='me')M.why='opinion';M.text=shareText(M);}
   renderSheet();},
 addProp:a=>{const [base,k]=a.split('|');const M=SHEET.model;const sid=M.sid;const r=curRound(sid);const ds=datesOf(sid,r.id);let p;
   if(k.startsWith('side:'))p={t:'side',side:k.slice(5),val:'yes'};
   else if(k==='date.set')p={t:'date.set',when:S.clock+2*864e5,place:'',by:goBetween(sid)[0]||'me'};
   else if(k==='date.move'){const d=ds.find(x=>x.status==='set');p={t:'date.move',did:d&&d.id,when:(d&&d.when)||S.clock,by:'girl'};}
   else if(k==='date.fb'){const d=[...ds].reverse().find(x=>x.status==='happened');p={t:'date.fb',did:d&&d.id,side:theirSide(sid),val:'continue'};}
   else if(k==='ask')p={t:'ask',purpose:'question',what:'an answer to a question'};
   else if(k==='pause')p={t:'pause',until:S.clock+14*864e5,by:theirSide(sid)};
   else if(k==='end')p={t:'end',by:theirSide(sid),why:''};
   p.on=true;M[base].push(p);renderSheet();},
 happen:()=>{const st=STEPS[S.story.i];S.story.happened[st.id]=true;closeSheet(true);happenOpen(st);},

 restart:()=>{const snap=JSON.stringify(S);seed();save();closeSheet(true);render();window.scrollTo(0,0);toast('Started over',()=>{S=JSON.parse(snap);dirty();save();render();});},
