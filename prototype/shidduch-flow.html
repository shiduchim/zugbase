<title>Shidduch Flow Prototype</title>
<meta name="description" content="zugbase clickable phone prototype: one ledger, ideas before shidduchim, sources and lists, made-up data only.">
<style>
/* Layout: one phone-width column on warm cream; near-white rounded cards; tabs at the bottom; sheets rise from the bottom. */
:root{
  --bg:#FBF6EE; --glow:#F7DFCB; --card:#FFFDFA; --track:#F1EAE0; --line:#ECE3D6; --hover:#F6F0E7;
  --ink:#1F2A44; --ink2:#776E66; --ink3:#A2988C;
  --accent:#3C6DB4; --accentSoft:#E5EDF9; --accentInk:#2B548F; --onAccent:#FFFFFF;
  --them:#8F5D05; --themSoft:#FCEFC9; --themLine:#EFD07A;
  --me:#2D5C9C; --meSoft:#E3ECF9;
  --ok:#2E7650; --okSoft:#DFF0E5;
  --no:#9B5443; --noSoft:#F6E3DC;
  --lav:#6A55A6; --lavSoft:#ECE6F8;
  --peach:#A4562A; --peachSoft:#FBE4D3;
  --sky:#2C6E83; --skySoft:#DDF0F5;
  --shadow:0 1px 2px #1F2A440D,0 6px 18px #1F2A440F;
  --shadow2:0 -4px 24px #1F2A441F;
  --scrim:#1F2A4459;
  --serif:"Noto Serif","Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs:15px; --pad:11px; --gap:10px; --av:38px; --r:16px; --btnH:34px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13171E; --glow:#2E2521; --card:#1C212A; --track:#262C37; --line:#2D3441; --hover:#232934;
  --ink:#E8ECF4; --ink2:#A9B0BD; --ink3:#7E8696;
  --accent:#8FB3EE; --accentSoft:#24344D; --accentInk:#B7CEF5; --onAccent:#10213B;
  --them:#F0C766; --themSoft:#3A2F15; --themLine:#6B5520;
  --me:#A3C2F2; --meSoft:#22314A;
  --ok:#8FD3AE; --okSoft:#1C3328;
  --no:#E7A797; --noSoft:#3B2520;
  --lav:#C2B3F0; --lavSoft:#2C2645;
  --peach:#F0B48E; --peachSoft:#3A281E;
  --sky:#93D2E3; --skySoft:#1B3540;
  --shadow:0 1px 2px #0000004D,0 6px 18px #00000040; --shadow2:0 -4px 24px #00000066; --scrim:#00000099;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13171E; --glow:#2E2521; --card:#1C212A; --track:#262C37; --line:#2D3441; --hover:#232934;
  --ink:#E8ECF4; --ink2:#A9B0BD; --ink3:#7E8696;
  --accent:#8FB3EE; --accentSoft:#24344D; --accentInk:#B7CEF5; --onAccent:#10213B;
  --them:#F0C766; --themSoft:#3A2F15; --themLine:#6B5520;
  --me:#A3C2F2; --meSoft:#22314A;
  --ok:#8FD3AE; --okSoft:#1C3328;
  --no:#E7A797; --noSoft:#3B2520;
  --lav:#C2B3F0; --lavSoft:#2C2645;
  --peach:#F0B48E; --peachSoft:#3A281E;
  --sky:#93D2E3; --skySoft:#1B3540;
  --shadow:0 1px 2px #0000004D,0 6px 18px #00000040; --shadow2:0 -4px 24px #00000066; --scrim:#00000099;
  color-scheme:dark;
}
/* Looks (presentation settings). They only change tokens. */
#app[data-look="blue"]{--bg:#F3F6FB;--glow:#DCE6F6;--track:#E9EEF6;--line:#E0E6EF;--hover:#EDF1F8;--ink2:#6C7383;--ink3:#9AA1AE}
#app[data-look="sage"]{--bg:#F4F7F1;--glow:#DCEAD9;--track:#E8EEE5;--line:#DDE6D9;--hover:#ECF1E9;--ink2:#6E766B;--ink3:#9AA295;--accent:#3E7A60;--accentSoft:#E0EEE6;--accentInk:#2D5E4A}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #app[data-look="blue"]{--bg:#11161F;--glow:#1D2A40;--track:#232B39;--line:#2A3342;--hover:#1F2735;--ink2:#A6AFBF;--ink3:#7B8597}
  :root:not([data-theme="light"]) #app[data-look="sage"]{--bg:#121813;--glow:#1E2D22;--track:#232C25;--line:#2B362D;--hover:#1E2720;--ink2:#A8B2A6;--ink3:#7F8A7D;--accent:#8CCBAE;--accentSoft:#1F3A2E;--accentInk:#B4E2CB}
}
:root[data-theme="dark"] #app[data-look="blue"]{--bg:#11161F;--glow:#1D2A40;--track:#232B39;--line:#2A3342;--hover:#1F2735;--ink2:#A6AFBF;--ink3:#7B8597}
:root[data-theme="dark"] #app[data-look="sage"]{--bg:#121813;--glow:#1E2D22;--track:#232C25;--line:#2B362D;--hover:#1E2720;--ink2:#A8B2A6;--ink3:#7F8A7D;--accent:#8CCBAE;--accentSoft:#1F3A2E;--accentInk:#B4E2CB}
#app[data-look="dark"]{
  --bg:#13171E; --glow:#2E2521; --card:#1C212A; --track:#262C37; --line:#2D3441; --hover:#232934;
  --ink:#E8ECF4; --ink2:#A9B0BD; --ink3:#7E8696;
  --accent:#8FB3EE; --accentSoft:#24344D; --accentInk:#B7CEF5; --onAccent:#10213B;
  --them:#F0C766; --themSoft:#3A2F15; --themLine:#6B5520;
  --me:#A3C2F2; --meSoft:#22314A;
  --ok:#8FD3AE; --okSoft:#1C3328;
  --no:#E7A797; --noSoft:#3B2520;
  --lav:#C2B3F0; --lavSoft:#2C2645;
  --peach:#F0B48E; --peachSoft:#3A281E;
  --sky:#93D2E3; --skySoft:#1B3540;
  --shadow:0 1px 2px #0000004D,0 6px 18px #00000040; --shadow2:0 -4px 24px #00000066; --scrim:#00000099;
  color-scheme:dark;
}
#app[data-density="compact"]{--fs:14px;--pad:7px;--gap:7px;--btnH:30px}
#app[data-av="l"]{--av:46px}
#app[data-av="s"]{--av:30px}
#app[data-density="compact"][data-av="m"]{--av:34px}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.4 var(--sans);-webkit-tap-highlight-color:transparent}
#app{background:var(--bg);color:var(--ink);font-size:var(--fs);max-width:480px;margin:0 auto;min-height:100%;position:relative;
  padding-bottom:calc(64px + var(--storyH,0px) + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}
.scr{padding:0 16px 16px}
.bh{position:absolute;top:6px;right:16px;font-size:11px;color:var(--ink3);letter-spacing:.02em;z-index:2}

/* Screen header */
.top{display:flex;align-items:center;gap:8px;padding:22px 0 8px}
.top h1{font:600 26px/1.15 var(--serif);margin:0;flex:1;min-width:0;letter-spacing:-.01em;text-wrap:balance}
.top h1 small{font:500 15px var(--sans);color:var(--ink3);margin-left:6px}
.word{font:600 25px/1 var(--serif);letter-spacing:-.01em;flex:1}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--track);color:var(--ink)}
.ib:active{background:var(--line)}
.ib.acc{background:var(--accentSoft);color:var(--accentInk)}
.zoom{display:flex;background:var(--track);border-radius:12px;padding:2px}
.zoom button{width:32px;height:32px;border-radius:10px;font-size:18px;color:var(--ink2)}
.zoom button:active{background:var(--card)}
.sub{color:var(--ink2);font-size:13px}
.backrow{display:flex;align-items:center;gap:6px;padding:18px 0 4px}
.back{display:flex;align-items:center;gap:2px;color:var(--accentInk);font-weight:600;padding:6px 8px 6px 0}

/* Mode switch */
.mode{display:flex;background:var(--track);border-radius:11px;padding:2px;font-size:12.5px}
.mode button{padding:5px 9px;border-radius:9px;color:var(--ink2);font-weight:600}
.mode button.on{background:var(--card);color:var(--accentInk);box-shadow:var(--shadow)}

/* Search */
.searchrow{display:flex;gap:8px;margin:6px 0 10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;height:42px;box-shadow:var(--shadow);color:var(--ink3);min-width:0}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;height:100%;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.filt{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink2);position:relative}
.filt.on{background:var(--accentSoft);color:var(--accentInk)}
.dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* Segmented views */
.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--track);border-radius:13px;padding:3px;margin:0 0 10px}
.seg button{flex:1 0 auto;padding:7px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--accentInk);box-shadow:var(--shadow)}
.seg button b{font-weight:700;margin-left:3px;color:inherit;opacity:.75}
.seg button.them b{color:var(--them);opacity:1}
.seg button.me b{color:var(--me);opacity:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 11px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px;color:var(--ink2);font-weight:600}
.chip.on{background:var(--accentSoft);color:var(--accentInk);box-shadow:none}

/* Cards and rows */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:var(--pad) 12px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;left:calc(var(--av) + 23px);right:0;top:0;border-top:1px solid var(--line)}
.row:active,.row.sel{background:var(--hover)}
.row.tint{background:var(--accentSoft)}
.row .m{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-weight:500;color:var(--ink2)}
.row .d{color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d2{color:var(--ink2);font-size:13px;display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;align-items:center}
.row .r{color:var(--ink3);font-size:12.5px;text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-variant-numeric:tabular-nums}
.row .chev{color:var(--ink3);flex:none}
.row.thin{--av:30px;padding-top:calc(var(--pad) - 3px);padding-bottom:calc(var(--pad) - 3px)}
.grp{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 4px 6px;display:flex;justify-content:space-between;align-items:baseline}
.grp:first-child{margin-top:4px}
.grp small{font-weight:500;color:var(--ink3)}
.more{display:block;width:100%;padding:12px;text-align:center;color:var(--accentInk);font-weight:600;font-size:14px}
.empty{padding:22px 16px;text-align:center;color:var(--ink2);font-size:14px}
.quiet{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;color:var(--ink3);font-size:13px;text-align:left}

/* Avatars */
.av{width:var(--av);height:var(--av);border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:calc(var(--av) * .36);letter-spacing:.02em;position:relative}
.av.c0{background:var(--accentSoft);color:var(--accentInk)}
.av.c1{background:var(--okSoft);color:var(--ok)}
.av.c2{background:var(--peachSoft);color:var(--peach)}
.av.c3{background:var(--lavSoft);color:var(--lav)}
.av.c4{background:var(--skySoft);color:var(--sky)}
.av.sil{background:var(--track);color:var(--ink3)}
.av.sil svg{width:62%;height:62%;fill:currentColor;stroke:none}
.av .badge{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.av .badge svg{width:12px;height:12px}
.pair{display:flex;flex:none}
.pair .av{width:calc(var(--av) * .8);height:calc(var(--av) * .8);font-size:calc(var(--av) * .3);box-shadow:0 0 0 2px var(--card)}
.pair .av+.av{margin-left:calc(var(--av) * -.2)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:600;background:var(--track);color:var(--ink2);white-space:nowrap;line-height:1.5}
.pill.them{background:var(--themSoft);color:var(--them)}
.pill.me{background:var(--meSoft);color:var(--me)}
.pill.ok{background:var(--okSoft);color:var(--ok)}
.pill.no{background:var(--noSoft);color:var(--no)}
.pill.lav{background:var(--lavSoft);color:var(--lav)}
.pill.peach{background:var(--peachSoft);color:var(--peach)}
.pill.acc{background:var(--accentSoft);color:var(--accentInk)}
.pill svg{width:12px;height:12px}

/* Tinted icon circles */
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic svg{width:18px;height:18px}
.ic.call{background:var(--okSoft);color:var(--ok)}
.ic.msg{background:var(--accentSoft);color:var(--accentInk)}
.ic.doc{background:var(--peachSoft);color:var(--peach)}
.ic.date{background:var(--lavSoft);color:var(--lav)}
.ic.wait{background:var(--themSoft);color:var(--them)}
.ic.ppl{background:var(--skySoft);color:var(--sky)}
.ic.note{background:var(--track);color:var(--ink2)}

/* Buttons */
.btn{height:var(--btnH);padding:0 13px;border-radius:11px;font-weight:650;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;background:var(--track);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--onAccent)}
.btn.sec{background:var(--accentSoft);color:var(--accentInk)}
.btn.them{background:var(--themSoft);color:var(--them)}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:9px}
.btn.icon{width:32px;padding:0}
.btn.wide{width:100%;height:44px;font-size:15px;border-radius:13px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.yn{display:inline-flex;gap:6px;flex:none}
.yn button{height:30px;min-width:52px;padding:0 10px;border-radius:9px;background:var(--track);font-weight:650;font-size:13.5px;color:var(--ink2)}
.yn button.on{background:var(--accent);color:var(--onAccent)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 11px;border-radius:11px;background:var(--track);font-weight:600;font-size:13.5px;color:var(--ink2)}
.opt.on{background:var(--accent);color:var(--onAccent)}
.opts.sm .opt{padding:4px 9px;font-size:12.5px;border-radius:9px}

/* Summary strip on Recent */
.sum{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px -16px 12px;padding:2px 16px 4px}
.sum::-webkit-scrollbar{display:none}
.sum button{flex:none;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:9px 12px;display:flex;align-items:center;gap:9px;text-align:left}
.sum .ic{width:30px;height:30px}
.sum b{display:block;font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums}
.sum span{display:block;font-size:12px;color:var(--ink2);white-space:nowrap}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 12px}
.sumgrid button{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:flex;align-items:center;gap:10px;text-align:left}
.sumgrid button:last-child:nth-child(odd){grid-column:1/-1}
.sumgrid b{display:block;font-size:20px;line-height:1.1}
.sumgrid span{display:block;font-size:12.5px;color:var(--ink2)}
.tofile{display:flex;align-items:center;gap:10px;width:100%;background:var(--themSoft);color:var(--them);border-radius:14px;padding:10px 12px;margin:0 0 12px;font-weight:650;text-align:left}
.tofile .m{flex:1}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.backup{font-size:12.5px;color:var(--ink3);margin:-2px 0 10px;display:flex;gap:6px;align-items:center}
.backup button{color:var(--accentInk);font-weight:600}

/* Person page */
.hero{margin:0 -16px;padding:4px 16px 12px;background:radial-gradient(120% 90% at 50% -10%,var(--glow),transparent 70%)}
.who{display:flex;align-items:center;gap:13px;padding:6px 0 12px}
.who .av{--av:64px}
.who .m{flex:1;min-width:0}
.who h2{margin:0;font:700 21px/1.2 var(--sans);text-wrap:balance}
.who .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px;text-align:left;min-width:0}
.tile .ic{width:28px;height:28px;margin-bottom:6px}
.tile .ic svg{width:15px;height:15px}
.tile>span{display:block;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{display:block;font-size:15px;line-height:1.25;margin-top:1px;overflow-wrap:anywhere}
.tile i{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tn{color:var(--them)} .tile .mn{color:var(--me)}
.contact{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0 2px}
.contact button{background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--ink2)}
.contact button svg{width:19px;height:19px}
.contact .call{color:var(--ok)} .contact .em{color:var(--accentInk)} .contact .wa{color:var(--ok)} .contact .sms{color:var(--accentInk)}
.contact .wt{color:var(--them)}
.contact .wt.on{background:var(--themSoft)}
.contact button:disabled{opacity:.35}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 10px}
.tabs button{padding:9px 10px 8px;font-weight:650;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14.5px}
.tabs button.on{color:var(--accentInk);border-color:var(--accent)}
.kv{display:flex;gap:10px;padding:10px 12px;align-items:flex-start;width:100%;text-align:left;position:relative}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{width:110px;flex:none;color:var(--ink2);font-size:13px;padding-top:1px}
.kv .k .sub{display:block}
.kv .v{flex:1;min-width:0;overflow-wrap:anywhere}
.kv .v .sub{display:block}
.kv .act{flex:none;align-self:center}
.kv.them .k{color:var(--them);font-weight:650}
.kv.me .k{color:var(--me);font-weight:650}
.kv.btnrow:active{background:var(--hover)}
.idea{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;margin:10px 0}
.idea .t{font-weight:700}
.idea .btns{margin-top:9px}
.profile{padding:12px;line-height:1.5}
.profile .vl{font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.fold{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;text-align:left;color:var(--ink2);font-weight:600}
.lock{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink3);font-weight:600}
.lock svg{width:12px;height:12px}
.photo{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;color:var(--ink2)}
.sep{height:10px}
.note{font-size:13px;color:var(--ink2);margin:8px 2px}
.note.c{text-align:center}
.round{font-size:13px;font-weight:700;color:var(--ink2);margin:16px 2px 6px;display:flex;align-items:center;gap:8px}
.round::after{content:"";flex:1;border-top:1px dashed var(--line)}

/* Stats on a source page */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0}
.stats button{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:8px 4px;text-align:center}

<div id="app" data-look="warm" data-density="comfortable" data-av="m"><div class="bh">ב״ה</div><main id="scr"></main><div id="story"></div><nav id="nav"></nav><div id="sheet" hidden></div><div id="toast"></div></div>
<script>
'use strict';
/* ===== Basics ===== */
const KEY='zugbase-proto-v2-data', UKEY='zugbase-proto-v2-look', PKEY='zugbase-proto-v2-proof';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY=864e5;
const T=(y,m,d,h=12,mi=0)=>new Date(y,m-1,d,h,mi).getTime();
const pad=n=>String(n).padStart(2,'0');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*([^*\n]+)\*/g,'<b>$1</b>');
const first=n=>String(n||'').replace(/^(Rabbi|Mrs\.?|Rebbetzin)\s+/,'').split(' ')[0];
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
const dd=(a,b)=>Math.round((sod(a)-sod(b))/DAY);
const yr=t=>new Date(t).getFullYear()!==new Date(D.clock).getFullYear()?', '+new Date(t).getFullYear():'';
const fShort=t=>{const d=new Date(t);return MON[d.getMonth()]+' '+d.getDate()+yr(t);};
const fDay=t=>{const d=new Date(t);return DOW[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate()+yr(t);};
const fTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const fWhen=t=>fDay(t)+', '+fTime(t);
const fMonth=t=>{const d=new Date(t);return MON[d.getMonth()]+' '+d.getFullYear();};
const ago=t=>{const n=dd(D.clock,t);if(n<=0)return 'today';if(n===1)return 'yesterday';if(n<14)return n+' d';if(n<60)return Math.round(n/7)+' wk';if(n<365)return Math.round(n/30.4)+' mo';return Math.round(n/365)+' yr';};
const agoLong=t=>{const n=dd(D.clock,t);if(n<=0)return 'today';if(n===1)return 'yesterday';if(n<14)return n+' days ago';if(n<60)return Math.round(n/7)+' weeks ago';if(n<365)return Math.round(n/30.4)+' months ago';const y=Math.round(n/365);return y+(y===1?' year':' years')+' ago';};
const days=t=>{const n=dd(D.clock,t);return n<=0?'today':n===1?'1 day':n+' days';};
const dayHead=t=>{const n=dd(D.clock,t);return n===0?'Today':n===1?'Yesterday':fDay(t);};
const dueTxt=t=>{const n=dd(t,D.clock);return n<0?'overdue since '+fShort(t):n===0?'today':n===1?'tomorrow':fDay(t);};
const dIn=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const tIn=t=>fTime(t);
const fromIn=(ds,ts)=>{const a=String(ds||'').split('-').map(Number);const b=String(ts||'12:00').split(':').map(Number);return T(a[0],a[1],a[2],b[0]||0,b[1]||0);};
const plural=(n,w,p)=>n+' '+(n===1?w:(p||w+'s'));
function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(16).padStart(8,'0');}

let D=null,U=null,PR=null,NAV=[],SHEETS=[],UNDO=[],CACHE=null,TOASTT=0;
const dirty=()=>{CACHE=null;};
const nid=p=>p+'-'+(++D.seq);
function loadJ(k){try{const t=localStorage.getItem(k);return t?JSON.parse(t):null;}catch(e){return null;}}
function saveJ(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const save=()=>saveJ(KEY,D), saveU=()=>saveJ(UKEY,U), saveP=()=>saveJ(PKEY,PR);

/* ===== People ===== */
const P=id=>D.people[id];
const resolve=id=>{let p=P(id),n=0;while(p&&p.mergedInto&&n<9){p=P(p.mergedInto);n++;}return p?p.id:id;};
const nm=id=>id==='me'?'Me':(P(id)?P(id).name:'Someone');
const fn=id=>id==='me'?'me':first(nm(id));
const people=()=>Object.values(D.people).filter(p=>!p.mergedInto&&!p.gone);
const has=(p,t)=>!!p&&p.types.includes(t);
const ofType=t=>people().filter(p=>has(p,t));
const her=id=>{const p=P(id);return p&&p.g==='m'?'his':p&&p.g==='f'?'her':'their';};
const initials=id=>{if(id==='me')return 'Me';const w=nm(id).replace(/^(Rabbi|Mrs\.?)\s+/,'').split(' ').filter(Boolean);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase();};
const hue=id=>{const s=nm(id);let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h%5;};
function newPerson(o){return Object.assign({id:nid('p'),name:'',types:[],g:'f',city:'',phones:[],email:'',age:null,ageAt:null,folders:[],added:D.clock,know:'',notes:''},o);}
const pkey=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('972'))d='0'+d.slice(3);return d.length>=7?d:'';};
const nkey=s=>String(s||'').toLowerCase().replace(/^(rabbi|mrs|mr|rebbetzin|r)\.?\s+/,'').replace(/[^a-z֐-׿ ]/g,'').replace(/\s+/g,' ').trim();
const intl=n=>{const d=pkey(n);return d.startsWith('0')?'+972 '+d.slice(1,3)+'-'+d.slice(3,6)+'-'+d.slice(6):n;};
const phoneOf=id=>{const p=P(id);return p&&p.phones[0]||null;};
const isBasic=id=>{const f=phoneOf(id);return !!(f&&f.basic);};

/* The one matching check. Every way in uses it. */
function matchCheck(q){
  const out=[],pk=pkey(q.phone),ek=String(q.email||'').toLowerCase(),n1=nkey(q.name);
  const skip=pid=>D.notSame.some(x=>x.pid===pid&&(x.key===pk||x.key===n1));
  for(const p of people()){
    if(p.id==='me'||skip(p.id))continue;
    if(pk&&p.phones.some(f=>pkey(f.n)===pk)){out.push({pid:p.id,how:'phone',level:'likely'});continue;}
    if(ek&&String(p.email).toLowerCase()===ek){out.push({pid:p.id,how:'email',level:'likely'});continue;}
    const n2=nkey(p.name);
    if(n1&&n1===n2){out.push({pid:p.id,how:'name',level:'ask'});continue;}
    if(n1&&n2){const a=n1.split(' '),b=n2.split(' ');if(a.length>1&&b.length>1&&a[a.length-1]===b[b.length-1]&&a[0][0]===b[0][0]&&a[0]!==b[0]&&q.city&&q.city===p.city)out.push({pid:p.id,how:'similar',level:'hint'});}
  }
  const rank={likely:0,ask:1,hint:2};
  return out.sort((x,y)=>rank[x.level]-rank[y.level]);
}

/* ===== The ledger ===== */
const CONTACT=new Set(['wa','call','email','sms','meet']);
const CHN={wa:'WhatsApp',call:'Call',email:'Email',sms:'SMS',note:'Note',meet:'In person'};
const MK={'person.new':'people','link.new':'links','src.new':'sources','idea.new':'ideas','shid.new':'shid','round.open':'rounds','date.new':'dates','item.open':'items','ver.new':'vers'};
function rec(o){
  const e=Object.assign({id:nid('e'),at:D.clock,ord:++D.ord,from:'me',to:[],ch:'note',text:'',files:[],c:[],filed:true,deleted:false},o);
  e.about=Object.assign({p:[],i:[],s:[],d:[],src:[]},o.about||{});
  for(const k of ['p','i','s','d','src'])e.about[k]=e.about[k].filter(Boolean);
  bind(e);D.entries.push(e);dirty();return e;
}
function bind(e){
  for(const c of e.c){const coll=MK[c.t];if(coll&&c.o){const o=c.o;if(coll!=='people')o.bornIn=e.id;else o.bornIn=o.bornIn||e.id;D[coll][o.id]=o;c.id=o.id;delete c.o;}}
  aboutFill(e);
}
function aboutFill(e){
  const a=e.about,add=(k,v)=>{if(v&&!a[k].includes(v))a[k].push(v);};
  for(const c of e.c){
    switch(c.t){
      case 'person.new':add('p',c.id);break;
      case 'link.new':{const l=D.links[c.id];add('p',l.a);add('p',l.b);break;}
      case 'met':add('p',c.pid);add('src',c.src);break;
      case 'refer':add('p',c.pid);if(c.by)add('p',c.by);add('src',c.src);break;
      case 'src.new':add('src',c.id);break;
      case 'idea.new':{const i=D.ideas[c.id];add('i',c.id);add('p',i.guy);add('p',i.girl);add('s',i.sid);break;}
      case 'idea.close':{const i=D.ideas[c.iid];add('i',c.iid);if(i){add('p',i.guy);add('p',i.girl);add('s',i.sid);}break;}
      case 'shid.new':{const s=D.shid[c.id];add('s',c.id);add('p',s.guy);add('p',s.girl);break;}
      case 'round.open':add('s',D.rounds[c.id].sid);break;
      case 'round.end':add('s',D.rounds[c.rid].sid);break;
      case 'side':add('s',c.sid);break;
      case 'date.new':{const d=D.dates[c.id];add('d',c.id);add('s',d.sid);break;}
      case 'date.move':case 'date.happened':case 'date.fb':{add('d',c.did);add('s',D.dates[c.did].sid);break;}
      case 'item.open':{const it=D.items[c.id];add('p',it.pid);add('p',it.subj);add('s',it.sid);add('d',it.did);add('i',it.iid);add('src',it.src);break;}
      case 'item.close':{const it=D.items[c.oid];if(it){add('p',it.pid);add('p',it.subj);add('s',it.sid);add('d',it.did);add('i',it.iid);}break;}
      case 'ver.new':add('p',D.vers[c.id].pid);break;
      case 'ver.sent':add('p',D.vers[c.vid].pid);add('p',c.to);break;
      case 'merge':add('p',c.into);break;
    }
  }
  a.p=a.p.filter(x=>x!=='me'||e.c.some(c=>(c.t==='ver.new'||c.t==='ver.sent')&&D.vers[c.id||c.vid]&&D.vers[c.id||c.vid].pid==='me'));
}

/* ===== Worked out from the ledger, never typed ===== */
function X(){
  if(CACHE)return CACHE;
  const c={E:{},live:[],att:{},closed:{},byP:{},last:{},out:{}};
  for(const e of D.entries)c.E[e.id]=e;
  c.live=D.entries.filter(e=>e.filed&&!e.deleted).sort((a,b)=>a.at-b.at||a.ord-b.ord);
  for(const e of c.live){
    for(const ch of e.c){
      if(ch.t==='attach')(c.att[ch.eid]=c.att[ch.eid]||[]).push(ch.sid);
      if(ch.t==='item.close'&&!c.closed[ch.oid])c.closed[ch.oid]=e;
    }
    const ps=new Set([e.from,...e.to,...e.about.p]);
    for(const p of ps)if(p)(c.byP[p]=c.byP[p]||[]).push(e);
    if(CONTACT.has(e.ch)){for(const p of [e.from,...e.to])if(p&&p!=='me')c.last[p]=e;
      if(e.from==='me'||e.ch==='call')for(const p of [e.from,...e.to])if(p&&p!=='me')c.out[p]=e;}
  }
  CACHE=c;return c;
}
const entryAlive=id=>{const e=X().E[id];return !!(e&&e.filed&&!e.deleted);};
const alive=o=>!!o&&(!o.bornIn||entryAlive(o.bornIn));
const aboutS=e=>{const a=X().att[e.id];return a?[...new Set(e.about.s.concat(a))]:e.about.s;};
const entriesOf=pid=>X().byP[pid]||[];
const lastContact=pid=>X().last[pid]||null;
const everContacted=pid=>!!X().out[pid];

/* Open items */
function itemOpen(it){if(!alive(it)||X().closed[it.id])return false;if(it.purpose==='list')return srcStats(it.src).follow>0;return true;}
function openItems(f){const c=X();if(!c.open)c.open=Object.values(D.items).filter(itemOpen);return f?c.open.filter(f):c.open;}
const itemSid=it=>{if(it.sid)return it.sid;if(it.iid){const r=Object.values(D.rounds).find(r=>r.idea===it.iid&&alive(r));if(r)return r.sid;}return null;};
const itemText=it=>it.purpose==='call'?'call, '+dueTxt(it.due):it.purpose==='list'?'follow up on '+D.sources[it.src].name+' ('+srcStats(it.src).follow+')':it.what;
const itemFull=it=>it.kind==='them'?'Waiting on '+fn(it.pid)+': '+itemText(it):(it.purpose==='call'?'Call '+nm(it.pid)+', '+dueTxt(it.due):it.purpose==='list'?cap(itemText(it)):fn(it.pid)+': '+itemText(it));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const itemSince=it=>{const e=X().E[it.bornIn];return e?e.at:D.clock;};
const isShadWorkItem=it=>{const s=itemSid(it);if(s&&D.shid[s]&&!isMine(D.shid[s]))return true;if(it.iid&&D.ideas[it.iid]&&!isMineIdea(D.ideas[it.iid]))return true;return false;};

/* Sources */
function srcStats(id){
  const c=X();c.ss=c.ss||{};if(c.ss[id])return c.ss[id];
  const s=D.sources[id],o={total:0,here:0,fresh:0,contacted:0,replied:0,follow:0,notc:0,notadded:0,met:0,lines:[]};
  c.ss[id]=o;
  if(!s||!alive(s))return o;
  if(s.kind==='event'){const seen=new Set();for(const e of c.live)for(const ch of e.c)if(ch.t==='met'&&ch.src===id&&!seen.has(ch.pid)){seen.add(ch.pid);o.lines.push({pid:resolve(ch.pid),st:'met',e});}o.met=o.total=o.lines.length;return o;}
  const fd=s.follow||{days:7};
  for(const ln of s.lines){
    const L=Object.assign({},ln,{st:'notadded'});o.total++;
    if(ln.was==='here')o.here++;else o.fresh++;
    const pid=ln.pid&&resolve(ln.pid);
    if(!pid||!P(pid)){o.notadded++;o.lines.push(L);continue;}
    L.pid=pid;let fc=null,rp=null;
    for(const e of entriesOf(pid)){
      if(e.at<s.at)continue;
      if(!fc){if((e.from==='me'&&e.to.includes(pid)&&CONTACT.has(e.ch))||(e.ch==='call'&&e.from===pid))fc=e;}
      else if(e.from===pid&&e!==fc){rp=e;break;}
    }
    if(!fc){L.st='notc';o.notc++;}

function proposeCloses(M){
  const out=[];

    const sid=itemSid(it);let on=null;
    const inbound=M.dir==='in'||(M.dir==='call'&&M.answered!==false);
    const outbound=M.dir==='out'||(M.dir==='call'&&M.answered!==false);
    if(it.kind==='them'&&inbound){
      if(it.purpose==='side')on=!!(M.side&&(M.side==='yes'||M.side==='no')&&(!M.sid||M.sid===sid));
      else if(it.purpose==='fb')on=!!(M.fb&&M.fbDid===it.did);

    if(it.kind==='me'&&outbound){

function kindOf(e){

  if(e.c.some(c=>c.t==='ver.sent'||c.t==='ver.new'||c.t==='idea.new'))return ['doc','doc'];
  if(e.c.some(c=>c.t==='item.open'&&D.items[c.id]&&D.items[c.id].purpose==='manual'))return ['wait','wait'];
  if(e.ch==='call')return ['phone','call'];
  if(e.ch==='meet'||e.c.some(c=>c.t==='refer'||c.t==='src.new'))return ['ppl','ppl'];
  if(e.ch==='note')return ['note','note'];
  if(e.ch==='email')return ['mail','msg'];
  if(e.ch==='sms')return ['sms','msg'];
  return ['msg','msg'];
}
function eTitle(e){
  if(e.ch==='note')return e.private?'Private note':'Note';

const excerpt=e=>{const t=String(e.text||'').replace(/\*/g,'').split('\n').find(x=>x.trim())||'';return t.length>96?t.slice(0,94)+'…':t;};
function effects(e){
  const out=[],a={pn:[],met:0,ref:0,cl:0,att:0};
  for(const c of e.c){
    switch(c.t){
      case 'person.new':a.pn.push(c.id);break;
      case 'met':a.met++;break;
      case 'refer':a.ref++;break;
      case 'src.new':{const s=D.sources[c.id];if(s.kind==='list'){const L=s.lines;out.push({t:L.length+' shadchanim · '+L.filter(l=>l.was==='new').length+' new · '+L.filter(l=>l.was==='here').length+' here',c:'acc'});}break;}
      case 'ver.new':{const v=D.vers[c.id];if(v)out.push({t:(v.pid==='me'?'My profile':first(nm(v.pid))+"'s profile")+' v'+verN(c.id),c:'peach'});break;}
      case 'ver.sent':out.push({t:'Sent '+verName(c.vid),c:'peach'});break;
      case 'idea.new':{const i=D.ideas[c.id];out.push({t:isMineIdea(i)?(i.sid?'Suggested again':'Idea for me')+': '+fn(i.girl==='me'?i.guy:i.girl):'Idea: '+fn(i.guy)+' ↔ '+fn(i.girl),c:'acc'});break;}
      case 'idea.close':out.push(c.how==='na'?{t:'Not applicable'}:{t:'Interested',c:'ok'});break;
      case 'shid.new':out.push({t:'Shidduch starts',c:'ok'});break;
      case 'round.open':{const r=D.rounds[c.id];if(r&&r.n>1)out.push({t:'Round '+r.n+' opens',c:'ok'});break;}
      case 'round.end':{const r=D.rounds[c.rid];out.push({t:'Round '+(r?r.n:'')+' ended',c:'no'});break;}
      case 'side':{const s=D.shid[c.sid];out.push({t:sideName(s,c.side)+': '+VAL[c.val],c:c.val==='yes'?'ok':c.val==='no'?'no':''});break;}
      case 'date.new':out.push({t:'Date '+D.dates[c.id].n+' set · '+fShort(c.when),c:'lav'});break;
      case 'date.move':out.push({t:'Date '+D.dates[c.did].n+' moved to '+fShort(c.when),c:'lav'});break;
      case 'date.happened':out.push({t:'Date '+D.dates[c.did].n+(c.yes?' happened':' did not happen'),c:'lav'});break;
      case 'date.fb':{const s=D.shid[D.dates[c.did].sid];out.push({t:fbName(s,c.side)+': '+VAL[c.val],c:c.val==='continue'?'ok':c.val==='stop'?'no':''});break;}
      case 'item.open':{const it=D.items[c.id];if(it.purpose==='list')break;out.push(it.kind==='them'?{t:'Waiting on '+fn(it.pid),c:'them'}:{t:it.purpose==='call'?'Call due '+dueTxt(it.due):'Waiting on me',c:'me'});break;}
      case 'item.close':a.cl++;break;
      case 'attach':a.att++;break;
    }
  }
  if(a.met)out.unshift({t:'Met '+a.met,c:'acc'});
  if(a.pn.length&&!a.met&&!e.c.some(c=>c.t==='src.new'))out.unshift({t:a.pn.length===1?'Added '+first(nm(a.pn[0])):'Added '+a.pn.length+' people'});
  if(a.ref&&!e.c.some(c=>c.t==='src.new'))out.push({t:'Recommended '+(a.ref===1?fn(e.c.find(c=>c.t==='refer').pid):a.ref),c:'acc'});
  if(a.cl)out.push({t:'Closes '+a.cl,c:'ok'});
  if(a.att)out.push({t:'Linked '+a.att});
  return out;
}

function renderSheet(fromMain){

function ideaMatch(F){const I=F.idea,m=matchCheck({name:I.name,city:I.city})[0];I.pid=null;I.askPid=null;I.hintPid=null;I.same=null;if(m){if(m.level==='likely'){I.pid=m.pid;I.same='yes';}else if(m.level==='ask')I.askPid=m.pid;else I.hintPid=m.pid;}}
function resolveOpt(sid,o){

/* Send: the one share flow */
const FB_TEXT={continue:"It went well, thank you. I'd like to continue.",unsure:"It was nice. I need a little time to think.",stop:"Thank you so much for everything. I don't think it's for me."};
function newSend(o){const M=Object.assign({to:null,vid:null,why:'send',words:'',photo:false,ch:'wa',sid:null,iid:null,side:null,fb:null,fbDid:null,thing:false,openSide:false,myFbFor:null,closes:{},subj:null},o);
  if(M.vid)M.subj=D.vers[M.vid].pid;
  const one=Array.isArray(M.to)?M.to[0]:M.to;
  if(one&&isBasic(one))M.ch='sms';else if(one&&!phoneOf(one)&&P(one)&&P(one).email)M.ch='email';
  if(!M.words)M.words=defaultWords(M);
  return M;}
function defaultWords(M){
  if(!M.vid)return M.words||'';
  if(M.subj==='me')return 'Hello! Here is my profile. I\'d be glad if you keep me in mind.';
  if(M.why==='opinion')return 'What do you think about this idea for me?';
  if(M.why==='suggest'){const s=M.sid&&D.shid[M.sid];return s?'I have an idea for '+fn(otherSingle(s,M.subj))+': '+nm(M.subj)+'. Here is the profile. What do you think?':'An idea: '+nm(M.subj)+'. What do you think?';}
  return nm(M.subj)+"'s profile.";
}
const otherSingle=(s,pid)=>s.guy===pid?s.girl:s.guy;
SH.send=M=>{
  const many=Array.isArray(M.to),one=many?M.to[0]:M.to,p=one&&P(one);
  let b='<div class="fl">To</div>';

  else b+=p?'<div class="match">'+av(one)+'<div class="m"><div class="t">'+esc(p.name)+'</div><div class="small">'+esc(p.phones[0]?(M.ch==='wa'?intl(p.phones[0].n)+' (WhatsApp)':p.phones[0].n):p.email||'needs a number')+'</div></div><button class="btn sm" data-a="pickTo">Change</button></div>':'<button class="btn wide sec" data-a="pickTo">Choose who</button>';
  const subs=[...new Set(['me'].concat(M.subjOpts||[],M.subj&&M.subj!=='me'?[M.subj]:[]))].filter(x=>x==='me'||P(x));

  const basic=one&&isBasic(one);
  if(M.vid){
    const vs=versOf(M.subj);
    b+='<div class="fl">Version</div>'+opts('vid',vs.map(v=>[v.id,'v'+verN(v.id)+' · '+fShort(v.at)+(v===vs[vs.length-1]?' (newest)':'')]),M.vid);
    if(M.subj!=='me')b+='<div class="fl">Why</div>'+opts('why',[['opinion','Ask opinion'],['suggest','Suggest'],['send','Just send']],M.why);
  }
  b+='<div class="fl">Your words</div><textarea class="fld" id="send-w" data-m="words" data-r>'+esc(M.words)+'</textarea>';
  const chans=[];if(p&&p.phones[0]&&!basic)chans.push(['wa','WhatsApp']);if(p&&p.email&&!basic)chans.push(['email','Email']);if(p&&p.phones[0])chans.push(['sms','SMS']);
  if(many)chans.splice(0,chans.length,['wa','WhatsApp']);
  if(chans.length>1)b+='<div class="fl">Send by</div>'+opts('ch',chans,M.ch);
  if(M.vid&&M.ch!=='sms'&&M.subj!=='me'&&has(P(M.subj),'girl'))b+='<div class="closes" style="margin-top:10px"><div class="kv"><div class="k">Include her photo</div>'+ynB('photo',M.photo)+'</div></div>';
  /* Preview: exactly what goes out */
  const v=M.vid&&D.vers[M.vid],bubs=[];
  if(v&&M.ch!=='sms')(v.files||[]).filter(f=>f.kind==='pdf').forEach(f=>bubs.push('<div class="bub file">'+ico('doc','s')+esc(f.name)+'</div>'));
  const text=(M.words?M.words:'')+(v?(M.words?'\n\n':'')+v.text:'');
  if(text)bubs.push('<div class="bub">'+rich(text)+'</div>');
  if(v&&M.photo&&M.ch!=='sms')bubs.push('<div class="bub file">'+silh.replace('<svg','<svg class="i s" style="fill:currentColor;stroke:none"')+'photo</div>');
  b+='<div class="fl">Preview <small>exactly what goes out</small></div><div class="prev">'+(bubs.join('')||'<div class="small">Nothing yet.</div>')+'</div><div class="note">Only what is shown here is sent: '+(v?'a profile version, ':'')+'your words'+(M.photo?', the photo':'')+'. No History, notes, reasons or private answers.'+(M.ch==='sms'&&v?' SMS carries text only.':'')+'</div>';
  const opens=[];
  if(M.vid&&M.why==='opinion'&&one)opens.push('Waiting on '+fn(one)+': '+her(one)+' opinion on '+fn(M.subj));
  if(M.vid&&M.why==='suggest'&&M.sid&&one)opens.push('Waiting on '+fn(one)+': '+sideName(D.shid[M.sid],sideOfGo(D.shid[M.sid],one)).toLowerCase()+"'s answer");
  if(M.openSide&&M.sid)opens.push('Waiting on '+fn(one)+': '+sideName(D.shid[M.sid],thK(D.shid[M.sid])).toLowerCase()+"'s answer");
  if(M.side&&M.sid)opens.push(sideName(D.shid[M.sid],myK(D.shid[M.sid]))+': '+VAL[M.side]);
  if(M.fb&&M.fbDid)opens.push('My feedback on Date '+D.dates[M.fbDid].n+': '+VAL[M.fb]);
  if(opens.length)b+='<div class="fl">This also records</div><div class="list">'+opens.map(t=>'<div class="kv"><div class="v">'+esc(t)+'</div></div>').join('')+'</div>';
  if(!many&&one)b+=closesBlock(proposeCloses(sendModel(Object.assign({},M,{to:one}))),M.closes);
  const lbl={wa:'Send by WhatsApp',email:'Send by email',sms:'Send by SMS'}[M.ch]||'Send';
  return {title:M.title||'Send',body:b,foot:'<button class="btn pri" data-a="doSend"'+(one?'':' disabled')+'>'+lbl+(many?' to '+M.to.length:'')+'</button>'};
};

SH.myProfile=()=>{
  const vs=versOf('me').slice().reverse(),nv=newest('me');

SH.behind=M=>{

  let b='<div class="fp">'+cnt.map(c=>'<div><b>'+c[1]+'</b><span>'+c[0]+'</span></div>').join('')+'</div><div class="note">Data fingerprint <span class="idc">'+fp+'</span>. Changing the mode, theme or density leaves it the same.</div>';
  let L=live.slice().reverse();
  if(M.id){const id=M.id;L=L.filter(e=>e.id===id||e.c.some(c=>Object.values(c).includes(id))||Object.values(e.about).some(a=>a.includes(id)));

  else b+='<div class="fl">The ledger, newest first <small>tap an ID</small></div>';
  const n=M.n||40;
  const idb=v=>'<button class="idc" data-a="set" data-m="id" data-v="'+esc(v)+'">'+esc(v)+'</button>';
  const cstr=c=>{const o=Object.assign({},c);const t=o.t;delete o.t;return '<b style="font-family:var(--mono);font-size:11.5px">'+t+'</b> '+Object.entries(o).map(([k,v])=>typeof v==='string'&&/^(e|p|s|r|d|o|i|v|l|src)-\d+$/.test(v)?k+' '+idb(v):(k==='when'?k+' '+fShort(v):'')).filter(Boolean).join(' ');};
  b+='<div class="list">'+L.slice(0,n).map(e=>'<div class="led"><b>'+esc(eTitle(e))+'</b> · '+fShort(e.at)+' '+fTime(e.at)+' '+idb(e.id)+(e.deleted?' deleted':'')+'<br>'+(e.c.length?e.c.slice(0,8).map(cstr).join('<br>')+(e.c.length>8?'<br>… '+(e.c.length-8)+' more':''):'<span style="color:var(--ink3)">no changes</span>')+'</div>').join('')+'</div>'+(L.length>n?'<button class="more" data-a="set" data-m="n" data-v="'+(n+60)+'">Show more</button>':'');
  return {title:'Behind the scenes',body:b};
};

function back(){NAV.pop();if(!NAV.length)NAV=[{v:'recent'}];render();window.scrollTo(0,SCROLLS.pop()||0);}
function render(){
  const app=$('#app');app.dataset.look=U.look;app.dataset.density=U.density;app.dataset.av=U.av;
  const top=NAV[NAV.length-1],f=focusInfo(),y=window.scrollY;
  $('#scr').innerHTML='<div class="scr">'+(VIEWS[top.v]||VIEWS.recent)(top)+'</div>';

  renderStory();renderSheet();
  window.scrollTo(0,y);restoreFocus(f);
  if(HL){const el=document.getElementById(HL)||document.querySelector('.'+HL);if(el){el.classList.add('hl');try{el.scrollIntoView({block:'center'});}catch(e){}}HL=null;}
}
function toast(msg,undo){
  const el=$('#toast');clearTimeout(TOASTT);
  el.innerHTML='<div class="in"><div class="tb" role="status"><span>'+esc(msg)+'</span>'+(undo&&UNDO.length?'<button data-a="undo">Undo</button>':'')+'</div></div>';
  TOASTT=setTimeout(()=>{el.innerHTML='';},undo?6000:3500);
}
function act(fn,msg,o){
  o=o||{};const snap=JSON.stringify(D);let res;
  try{res=fn();}catch(err){console.error(err);D=JSON.parse(snap);dirty();toast('That did not work: '+err.message);render();return null;}
  UNDO.push(snap);if(UNDO.length>40)UNDO.shift();
  dirty();storyTick();save();
  if(!o.keep)SHEETS=[];
  if(o.then)o.then(res);
  render();if(msg)toast(msg,true);
  return res;
}

  else setPath(M,d.m,v);
